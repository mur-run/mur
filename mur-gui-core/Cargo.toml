[package]
name = "mur-gui-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared GUI core library — sidecar supervisor, companion bridge, A2A client. Consumed by mur-hub-gui and (during migration) mur-agent-gui."

[dependencies]
mur-common = { path = "../mur-common" }
tokio = { workspace = true, features = ["net"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = "0.10"
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sys-locale = "0.3"                  # read the OS locale to pass STT language down to spawned agents
async-trait = "0.1"
image = "0.25"
reqwest = { workspace = true }
base64 = "0.22"
chrono = { workspace = true }
notify = "6"

[features]
audio = []

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
