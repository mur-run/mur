[workspace]
resolver = "2"
members = [
    "mur-common",
    "mur-core",
    "mur-agent-runtime",
    # "mur-commander",  # separate crate — v0.2.0 released
]

[workspace.package]
version = "2.4.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/mur-run/mur"
authors = ["David Chang <karajan@global-ok.com>"]

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "io-std", "time", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking", "gzip"], default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
anyhow = "1"
thiserror = "2"

# Template processing dependencies
handlebars = "4.5"

# Companion subsystem dependencies (Phase 1.1)
rand = "0.8"
once_cell = "1"
seahash = "4"
whatlang = "0.16"
ulid = { version = "1", features = ["serde"] }
fs2 = "0.4"
chrono-tz = "0.8"
insta = { version = "1", features = ["yaml"] }