# `mur-core`'s bin target has ~12 clap CLI-parse tests that overflow the default
# 2 MiB thread stack in a debug build. Without this they SIGABRT, so a bare
# `cargo nextest run --workspace` is red for everyone unless they know to
# export it by hand. nextest has no `[env]` key of its own (0.9.137 warns
# "ignoring unknown configuration key"), so it lives here.
[env]
RUST_MIN_STACK = "33554432"

# Local dev overrides for the CI-tuned [profile.dev] in Cargo.toml
# (debug = 0, incremental = false). Profile keys here take precedence
# over Cargo.toml; CI still forces them off via CARGO_INCREMENTAL=0 and
# CARGO_PROFILE_DEV_DEBUG=0, since env vars beat config files.
# Note: setting CARGO_PROFILE_DEV_INCREMENTAL under [env] would NOT work —
# [env] only reaches processes cargo spawns, not cargo's own config.
[profile.dev]
debug = 2
incremental = true
