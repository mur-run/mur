# Nextest configuration. Loaded by `cargo nextest` when CONFIG_KEY is unset.
#
# Profiles:
# - `default`: developer-friendly defaults
# - `ci`: used in `.github/workflows/ci.yml`. Tighter timeouts + structured
#         failure output; vector-DB heavy tests in mur-core run with limited
#         concurrency to avoid OOM on 16 GB hosted runners.
#
# Reference: https://nexte.st/docs/configuration/reference/

[profile.default]
fail-fast = false

[profile.ci]
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 2 }
global-timeout = "30m"
failure-output = "immediate-final"
status-level = "skip"

# Limit concurrency for the heaviest tests so we don't OOM 16 GB Windows
# runners when 4 lance/qdrant/tantivy tests collide. mur-core's vector
# DB and full-text search code paths each can sit at 2-3 GB RSS during a
# real probe.
[[profile.ci.overrides]]
# Test names in mur-core are all lowercase, so no case-insensitive flag needed.
# Nextest's filterset regex syntax uses `/pattern/` literals; `/i` flag is
# not supported (use inline `(?i)` if needed).
filter = 'package(mur-core) and test(/lance|vector|qdrant|tantivy|index/)'
test-group = 'heavy'

[test-groups]
heavy = { max-threads = 2 }
mcp-serial = { max-threads = 1 }

# mur-mcp-server runs one test at a time. Not for resources — for a fd race in
# the runner that no code in this repo can prevent.
#
# Rust std on macOS has no pipe2, so a test's captured-stdout pipe is created
# with pipe() and only then marked CLOEXEC (std/src/sys/pipe/unix.rs), and its
# posix_spawn sets no POSIX_SPAWN_CLOEXEC_DEFAULT (std/src/sys/process/unix/
# unix.rs). nextest spawns tests from several threads, so a test spawned in
# that window inherits a sibling's stdout write end at some fd ≥ 3 — lsof
# showed the same fd number and pipe peer in an integration-* process, in the
# mur-mcp-server child it spawned, and in nextest itself, across 8 leaky runs
# out of 30. When the inheritor is a 12–25 s integration test, the sibling
# unit test (whichever was being spawned at that instant) exits, nextest never
# sees EOF, and reports it leaky. Leak-timeout is not the lever: 1 ms, 100 ms,
# 2 s and 30 s all leaked at ~25%, because the holder lives longer than any
# of them. Neither test binary leaks when run alone (10 runs each); only the
# two together. Serialising the package removes the concurrent spawn, and with
# it the race. Costs the parallelism of five ~5 s integration tests.
[[profile.default.overrides]]
filter = 'package(mur-mcp-server)'
test-group = 'mcp-serial'
