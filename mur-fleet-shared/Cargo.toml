[package]
name = "mur-fleet-shared"
version.workspace = true
edition.workspace = true
# Internal to the workspace: consumed only via path deps, never from crates.io.
publish = false
license.workspace = true
repository.workspace = true
authors.workspace = true

# Shared file format of the fleet shared area (spec v3.26). Lives below both the
# agent runtime and the daemon, so it must not depend on `mur-core`.

[dependencies]
mur-common = { path = "../mur-common" }
mur-channel = { path = "../mur-channel" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
