[package]
name = "mur-git-broker"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = "0.2"
sha2 = "0.10"
hex = "0.4"
chrono = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
libc = "0.2"
serde_yaml_ng = "0.10"
mur-common = { path = "../mur-common" }
secrecy = "0.10"
zeroize = "1"

# The same dispatch the daemon's `main` does: git runs this as `GIT_ASKPASS`, so a test can exercise
# the real answer path under real git without depending on the daemon crate.
[[bin]]
name = "askpass-probe"
path = "tests/support/askpass_probe.rs"
required-features = ["test-support"]

[features]
# Exposes `PendingStore::force_state_for_test`, which bypasses the edge table.
test-support = []

[dev-dependencies]
tempfile = "3"
mur-git-broker = { path = ".", features = ["test-support"] }
