[package]
name = "mur-git-broker"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = "0.2"
sha2 = "0.10"
hex = "0.4"
chrono = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
libc = "0.2"

[features]
# Exposes `PendingStore::force_state_for_test`, which bypasses the edge table.
test-support = []

[dev-dependencies]
tempfile = "3"
mur-git-broker = { path = ".", features = ["test-support"] }
