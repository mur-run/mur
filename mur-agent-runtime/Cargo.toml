[package]
name = "mur-agent-runtime"
version = "0.1.0"
edition = "2024"
build = "build.rs"
# Internal to the workspace: consumed only via path deps, never from crates.io.
publish = false

[features]
# Bundle an agent profile into the binary at compile time; set
# MUR_EXPORT_AGENT_DIR=<path> alongside `cargo build --features=embedded-agent`.
embedded-agent = []
# Kokoro TTS via ONNX Runtime. Off by default so crates that only use STT /
# the rest of the runtime (the CLI, the Tauri GUIs via mur-gui-core) don't
# static-link onnxruntime — which both bloats them and fails to link on older
# glibc (ubuntu-22.04). Enabled by mur-daemon, which actually synthesizes.
tts = ["dep:ort", "dep:ndarray"]

[build-dependencies]
tar = "0.4"
flate2 = "1"

[[bin]]
name = "mur-agent-runtime"
path = "src/main.rs"

[[bin]]
name = "mock_mcp"
path = "tests/fixtures/mock_mcp/main.rs"
test = false
doc = false

[lib]
path = "src/lib.rs"

[dependencies]
mur-common = { path = "../mur-common" }
mur-compress = { path = "../mur-compress" }
mur-channel = { path = "../mur-channel" }
mur-open-items = { path = "../mur-open-items" }
tokio = { workspace = true, features = ["net"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = "0.10"  # not in workspace (workspace has serde_yaml 0.9)
clap = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
cron = "0.12"
uuid = { workspace = true, features = ["v7"] }
reqwest = { workspace = true }
secrecy = "0.10"
sha2 = "0.10"
# C5 / M5.2 — webhook HMAC verifier. `hmac` for the MAC, `subtle`
# for constant-time comparison so signature checks aren't
# timing-side-channel-vulnerable.
hmac = "0.12"
subtle = "2"
# C5 / M5.4 — webhook payload bridge: image/file kinds carry
# base64 (URL-safe, no padding) so we can decode them without a
# multipart parser.
base64 = "0.22"
# C-watch — proactive co-watching scene detection (Task 6). dHash perceptual
# hashing for scene-change detection from VLC snapshots.
image = "0.25"
mime_guess = "2"
snow = { version = "0.9", default-features = false, features = ["default-resolver"] }
hex = "0.4"
glob = "0.3"
fs2 = "0.4"
http = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
axum = { version = "0.8", features = ["json"] }
tar = "0.4"
flate2 = "1"
dialoguer = "0.11"
futures = "0.3"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["rt", "codec"] }
dirs = "5"
tempfile = "3"
whatlang = { workspace = true }
rand = { workspace = true }
# B0 rule 2 (M7.3) parses `url` field from network tool inputs to derive the
# host before consulting the entitlement allowlist + GrantStore. Already
# pulled in transitively by reqwest; declare it explicitly here so the
# import surface is documented.
url = "2"
# B0 rule 7 (M7.5) outbound secret pre-filter compiles ~11 credential
# patterns once via OnceLock and matches each outbound message body before
# delivery. Pattern set deliberately favors false-positives.
regex = "1"
# Track C1 — bridge dedupe store. Sled gives us an embedded transactional
# K/V tree. We store `(bridge_id, platform_msg_id) -> u64 LE timestamp` and
# sweep entries older than 7 days.
sled = { workspace = true }
# Track C2 — Telegram bridge. teloxide drives long-poll updates with built-in
# Throttle (FloodControl) + CacheMe (User profile cache) adaptors. We disable
# default-features so we don't pull native-tls; rustls keeps the dep tree
# consistent with reqwest.
teloxide = { version = "0.13", default-features = false, features = ["rustls", "throttle", "cache-me"] }
# Track C7 — Slack bridge (Socket Mode). tokio-tungstenite drives the WSS
# connection; rustls keeps TLS consistent with reqwest/teloxide.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
# D1 voice — TTS + STT (Tasks 3-8)
indicatif = "0.17"   # progress bar for download
# ONNX Runtime for Kokoro TTS. Use the default `download-binaries` (static link
# the ABI-matched prebuilt at build time) rather than `load-dynamic` (runtime
# dlopen): the static lib can't drift from ort's expected ABI, covers all
# platforms via upstream prebuilts, and works offline — no runtime voice-pack
# dylib to provision. See `docs` / memory `project_voice_mobile_runtime_gotchas`.
ort = { version = "2.0.0-rc.12", features = ["ndarray"], optional = true }
ndarray = { version = "0.17", optional = true }            # tensor arrays for ort
espeak-ng = "0.1"                                           # espeak-ng G2P for Kokoro tokenizer (pure Rust, no bindgen)
whisper-rs = { version = "0.16", default-features = false } # whisper.cpp STT bindings (CPU-only; no metal to keep CI clean). 0.16 vendors a modern whisper.cpp that builds under Xcode 16; 0.11 (whisper-rs-sys 0.9) does not.
cpal = "0.15"                                               # cross-platform audio I/O (mic capture + speaker playback)
sys-locale = "0.3"                                          # detect the OS locale so STT language/script follows the device, not a hard-coded value
# B1 sandbox — MCP child process sandboxing (Task 7).
# birdcage 0.8 does not compile on Windows (upstream bug); gated to unix-like targets.
# child.rs already falls back to cmd.spawn() on Windows via #[cfg(not(unix))].
[target.'cfg(not(target_os = "windows"))'.dependencies]
birdcage = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# ───── B1 sandbox ─────
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Foundation",
] }

[dev-dependencies]
tempfile = "3"
ctor = "0.2"
httpmock = "0.7"
# C5 / M5.2 webhook handler unit tests use `tower::ServiceExt::oneshot`
# to drive synthetic Axum requests through the router without binding
# a TCP socket. `util` is the only feature we need.
tower = { version = "0.5", features = ["util"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
insta = { workspace = true }
criterion = { version = "0.5", default-features = false }
# Auth-precedence tests install a mock credential builder. Version pinned to
# match mur-common's keyring dep so the mock-builder ABI matches what
# mur_common::secret::keychain_get reads.
keyring = { version = "3", default-features = false }

[[bench]]
name = "companion"
harness = false
