[package]
name = "mur-agent-runtime"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
# Bundle an agent profile into the binary at compile time; set
# MUR_EXPORT_AGENT_DIR=<path> alongside `cargo build --features=embedded-agent`.
embedded-agent = []

[build-dependencies]
tar = "0.4"
flate2 = "1"

[[bin]]
name = "mur-agent-runtime"
path = "src/main.rs"

[[bin]]
name = "mock_mcp"
path = "tests/fixtures/mock_mcp/main.rs"
test = false
doc = false

[lib]
path = "src/lib.rs"

[dependencies]
mur-common = { path = "../mur-common" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = "0.10"  # not in workspace (workspace has serde_yaml 0.9)
clap = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
reqwest = { workspace = true }
secrecy = "0.10"
sha2 = "0.10"
snow = { version = "0.9", default-features = false, features = ["default-resolver"] }
hex = "0.4"
glob = "0.3"
fs2 = "0.4"
http = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
axum = { version = "0.8", features = ["json"] }
tar = "0.4"
flate2 = "1"
dialoguer = "0.11"
futures = "0.3"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
dirs = "5"
tempfile = "3"
whatlang = { workspace = true }
rand = { workspace = true }
# B0 rule 2 (M7.3) parses `url` field from network tool inputs to derive the
# host before consulting the entitlement allowlist + GrantStore. Already
# pulled in transitively by reqwest; declare it explicitly here so the
# import surface is documented.
url = "2"
# B0 rule 7 (M7.5) outbound secret pre-filter compiles ~11 credential
# patterns once via OnceLock and matches each outbound message body before
# delivery. Pattern set deliberately favors false-positives.
regex = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
httpmock = "0.7"
x25519-dalek = { version = "2", features = ["static_secrets"] }
insta = { workspace = true }
criterion = { version = "0.5", default-features = false }
# Auth-precedence tests install a mock credential builder. Version pinned to
# match mur-common's keyring dep so the mock-builder ABI matches what
# mur_common::secret::keychain_get reads.
keyring = { version = "3", default-features = false }

[[bench]]
name = "companion"
harness = false
