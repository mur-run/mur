[package]
name = "mur-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "murmurd"
path = "src/main.rs"

[dependencies]
mur-common = { path = "../mur-common" }
mur-core = { path = "../mur-core" }
mur-channel = { path = "../mur-channel" }
mur-track = { path = "../mur-track" }
mur-git-broker = { path = "../mur-git-broker" }
mur-agent-runtime = { path = "../mur-agent-runtime", features = ["tts"] }
base64 = "0.22"
fs2 = { workspace = true }
mdns-sd = "0.20"
hostname = "0.4"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
chrono = { workspace = true }
anyhow = { workspace = true }
serde_yaml_ng = "0.10"
tracing = { workspace = true }
dirs = "6"
axum = { version = "0.8", features = ["json", "ws"] }
uuid = { workspace = true }
tower = "0.5"
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
# Re-exec hook for the sealed-agent half of `tests/cross_router_dispatch_e2e.rs`.
ctor = "0.2"
