schema: 1
id: "00000000-0000-0000-0000-000000000000"
name: mur
display_name: "MUR"
version: "0.1.0"
persona:
  category: custom
  description: "MUR — the clever blue starling who runs your agents locally."
  traits:
    tone: "friendly"
    risk: "conservative"
    verbosity: "balanced"
sys_prompt_file: sys_prompt.md
model:
  provider: local
  name: Qwen3.5-2B-MLX-4bit
  params:
    temperature: 0.7
    top_p: 0.8
    max_tokens: 1024
skills:
  - skills/concierge
  - skills/brainstorming
transport:
  stdio: true
  socket:
    enabled: true
    bind: "unix://{{agent_home}}/agent.sock"
    auth: ~
  tcp:
    enabled: false
    bind: "127.0.0.1:0"
  webhook: {}
communication:
  accepts_from:
    - "*"
  sends_to: []
capabilities:
  - a2a.message.send
  - a2a.tasks
entitlements:
  network:
    inbound:
      ports: []
    outbound:
      mode: restricted
      allow_hosts:
        - "localhost"
        - "127.0.0.1"
  filesystem:
    # MUR's own authoring dirs. Without these the concierge can talk about
    # skills/workflows/fleets but cannot create one — every road ends in
    # "run this command yourself". Listed one by one on purpose: a blanket
    # `~/.mur` read would expose `agents/*/identity.key` (every other agent's
    # Ed25519 signing key), and `~/.mur/agents` write would let this agent
    # author a sibling profile with unrestricted entitlements and start it.
    # `self_protected()` only covers the agent's OWN profile.yaml + key.
    # `~/.mur/config.yaml` is deliberately absent: `Config::load_or_default`
    # never creates it, so on a fresh host the grant would be dropped at seal
    # time — the exact dead-grant trap this set exists to avoid.
    read:
      - "~/.mur/skills"
      - "~/.mur/workflows"
      - "~/.mur/fleets"
      - "~/.mur/artifacts"
    write:
      - "~/.mur/skills"
      - "~/.mur/workflows"
      - "~/.mur/fleets"
      - "~/.mur/artifacts"
    deny: []
  processes:
    spawn:
      mode: "none"
      allowed: []
notifications:
  enabled: false
  channels: []
retry:
  llm:
    max_retries: 3
    backoff: exponential
    initial_delay_ms: 1000
    max_delay_ms: 30000
    retry_on:
      - rate_limit
  tool:
    max_retries: 1
    backoff: fixed
    initial_delay_ms: 500
    max_delay_ms: ~
    retry_on: []
lifecycle:
  restart: on_failure
  max_restarts: 3
  restart_window_secs: 600
  stop_timeout_secs: 15
  mcp_required: false
  execution: daemon
  schedule: []
  idle_triggers: []
created_at: "2026-01-01T00:00:00Z"
updated_at: "2026-01-01T00:00:00Z"
