name: MurVoice
options:
  bundleIdPrefix: run.mur
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: JQ2C2UA8JV
    CODE_SIGN_STYLE: Automatic
targets:
  MurVoice:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # The UniFFI-generated Swift is compiled into the app target; the C FFI
      # module it imports (mur_mobile_sdkFFI) is provided by the xcframework.
      - path: Generated/mur_mobile_sdk.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: run.mur.voice
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Sources/Info.plist
    dependencies:
      - sdk: Speech.framework
      # Produced by ./build-ios.sh (requires full Xcode + iOS Rust targets).
      - framework: Frameworks/MurMobileSDK.xcframework
        embed: true
        codeSign: true
