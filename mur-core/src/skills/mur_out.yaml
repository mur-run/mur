name: mur-out
version: 0.1.0
publisher: human:mur
description: "Stop recording and extract learned patterns from the captured mur session"
category: workflow
content:
  abstract: |
    Stop session recording and extract patterns. Presents a numbered
    action menu (analyze, export, sync, skip).
  procedure:
    steps:
      - description: Run `mur session out` and show the output to the user.
      - description: Present the numbered action menu and ask which one the user wants.
      - description: Run `mur session out --action <choice>` with the user's selection.
tags: [mur, recording, extraction, builtin]
triggers:
  - type: command
    pattern: "/mur-out"
priority: normal
