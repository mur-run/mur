name: mur-deep-research
version: 0.2.0
publisher: human:mur
description: "Use when asked to research a topic, do web/deep research, or survey sources — 研究, 深入研究, 查資料, 調查."
category: workflow
hosts: [all]
content:
  abstract: |
    MUR ships a native deep-research fleet. `mur deep-research "question"`
    runs a guarded multi-agent research loop; bare shows status; `setup`
    is the one-time wizard. Reach for it before hand-rolling web searches.
  context: |
    # mur-deep-research — native research fleet

    When the user asks for research on a topic, choose the path that matches
    who is acting instead of hand-rolling ad-hoc web searches.

    ## Agent path

    Agents use the built-in `fleet_run` tool — never shell out to `mur`:

    ```json
    {"fleet":"deep-research","goal":"the question"}
    ```

    It returns a `run_id` immediately. Poll that id with `mur_job_status`;
    the result lands in the fleet channel, not in the tool reply. A refusal
    is a deny-by-default config fact (`fleet_run.agents` and
    `fleet_run.fleets` in `~/.mur/config.yaml`), not something to bypass.
    The run remains bounded by its fleet deadline, iteration/stuck limits,
    optional cost cap, and `mur fleet stop deep-research`.

    ## Human CLI path

    1. `mur deep-research` (bare) — status panel: provisioned or not,
       model, worker count, budget, egress state.
    2. Not provisioned → `mur deep-research setup` — interactive wizard
       (model, workers, budget, egress consent). Run it WITH the user:
       egress consent is an explicit human decision, never assume it.
    3. Provisioned → `mur deep-research "the question"` — preflight
       checks, then a guarded fleet loop (iteration cap, deadline,
       budget, kill-switch, RESEARCH_COMPLETE marker convergence).

    ## CLI flags

    | Command | Meaning |
    |---|---|
    | `mur deep-research` | Show status |
    | `mur deep-research setup` | Interactive one-time setup |
    | `mur deep-research provision` | Create restricted workers and gateway |
    | `mur deep-research "question"` | Run guarded research |
    | `mur fleet stop deep-research` | Stop the active run |

    Workers mount the `research-gateway` MCP server and have no egress of
    their own; the per-server egress grant remains a separate human consent.
    Read progress through the returned handle with `mur_job_status`, or at
    `~/.mur/fleet-state/deep-research/.run_progress.json`; unfinished records older
    than 600 seconds are stale.
tags: [mur, deep-research, fleet, builtin]
triggers:
  - type: keyword
    pattern: "(deep.?research|research (this|that|the web|into)|survey sources|literature review|幫我研究|深入研究|深度研究|查資料)"
  - type: manual
priority: normal
