  context: |
    # mur-in — Mark this session as important

    Recording is always on (ambient capture via hooks). Run `mur in` to MARK
    the current session so the harvest gate never skips it. You do NOT need to
    record events manually — do not call `mur session record`.

    When to use: before debugging, exploring new codebases, or any non-trivial
    task you want turned into a reusable workflow.
