    # mur-in — Start Recording

    Run `mur session in` to start a session and inject context patterns.

    Captures user prompts, AI responses, tool calls, errors. Used later
    by mur-out to extract patterns. When to use: before debugging,
    exploring new codebases, or any non-trivial task.
