[package]
name = "mur-core"
description = "Continuous learning for AI assistants — CLI and library"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mur_core"
path = "src/lib.rs"

[[bin]]
name = "mur"
path = "src/main.rs"

[dependencies]
mur-common = { path = "../mur-common" }
mur-agent-runtime = { path = "../mur-agent-runtime" }  # for cmd::agent::cmd_export
tar = "0.4"           # cmd::agent_export_gui template-mode identity stripping
flate2 = "1"          # gzip wrapper for the same
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
serde_yaml_ng = "0.10"  # AgentProfile uses serde_yaml_ng::Value in model.params
libc = "0.2"
clap = { workspace = true, optional = true }
reqwest = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
git2 = { version = "0.20", default-features = false }
diff = "0.1"
async-trait = "0.1"
notify = "6"
oauth2 = { version = "4", features = ["reqwest"] }
governor = "0.6"
keyring = "3"
rpassword = "7"
fs2 = "0.4"
walkdir = "2"
aho-corasick = "1"
thiserror = { workspace = true }
dirs = "6"
tempfile = "3"
sha2 = "0.10"
hex = "0.4"
regex = "1"
semver = "1"
lancedb = "0.26"
tantivy = "0.24"   # match lance's transitive dep so we don't compile two
                   # tantivy versions (~50K LOC each) on every CI run
qdrant-client = { version = "1.12", optional = true }   # gated behind `qdrant` feature
arrow-array = "57"
arrow-schema = "57"
futures = "0.3"
async-stream = "0.3"
tokio-util = "0.7"

# Phase 0: local API server (optional, behind "server" feature)
axum = { version = "0.8", features = ["ws"], optional = true }
tower-http = { version = "0.6", features = ["cors", "fs"], optional = true }
rust-embed = { version = "8", features = ["interpolate-folder-path", "include-exclude"], optional = true }

# Phase 4: interactive CLI (optional, behind "cli" feature)
dialoguer = { version = "0.11", optional = true }
console = { version = "0.15", optional = true }
open = "5"
hostname = "0.4.2"
dotenvy = "0.15"
shellexpand = "3"
urlencoding = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.30"
pulldown-cmark = "0.12"
rand = "0.8"
serde_jcs = "0.2"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
bs58 = "0.5"
base64 = "0.22"          # cmd::agent_companion::card::png chara/ccv3 chunk decode
ulid = { workspace = true }  # cmd::agent_companion::card::import inbox id

[features]
default = ["cli", "server", "sources"]
cli = ["dialoguer", "console", "clap"]
server = ["axum", "tower-http", "rust-embed"]
sources = []
ollama-live-smoke = []
# `qdrant` enables QdrantStore as a vector_backend. Off by default because
# the qdrant-client@1.x dep tree drags in older axum/hyper/prost/tower/
# reqwest/tonic versions (~5 duplicate compiles in our workspace), costing
# ~3-5 min Windows CI compile per run. lancedb is the default backend
# anyway; flip this only when you need to point at a remote Qdrant.
#   cargo build --features qdrant
qdrant = ["dep:qdrant-client"]

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
wiremock = "0.6"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
futures-util = "0.3"
