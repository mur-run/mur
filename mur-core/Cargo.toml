[package]
name = "mur-core"
description = "Continuous learning for AI assistants — CLI and library"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mur_core"
path = "src/lib.rs"

[[bin]]
name = "mur"
path = "src/main.rs"

[dependencies]
mur-common = { path = "../mur-common" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
clap = { workspace = true, optional = true }
reqwest = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
async-trait = "0.1"
notify = "6"
oauth2 = { version = "4", features = ["reqwest"] }
governor = "0.6"
keyring = "3"
fs2 = "0.4"
walkdir = "2"
aho-corasick = "1"
thiserror = { workspace = true }
dirs = "6"
sha2 = "0.10"
hex = "0.4"
regex = "1"
lancedb = "0.26"
tantivy = "0.22"
qdrant-client = "1.12"
arrow-array = "57"
arrow-schema = "57"
futures = "0.3"
async-stream = "0.3"
tokio-util = "0.7"

# Phase 0: local API server (optional, behind "server" feature)
axum = { version = "0.8", features = ["ws"], optional = true }
tower-http = { version = "0.6", features = ["cors", "fs"], optional = true }
rust-embed = { version = "8", features = ["interpolate-folder-path", "include-exclude"], optional = true }

# Phase 4: interactive CLI (optional, behind "cli" feature)
dialoguer = { version = "0.11", optional = true }
console = { version = "0.15", optional = true }
open = "5"
hostname = "0.4.2"
dotenvy = "0.15"
shellexpand = "3"
urlencoding = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.30"
pulldown-cmark = "0.12"
rand = "0.8"

[features]
default = ["cli", "server", "sources"]
cli = ["dialoguer", "console", "clap"]
server = ["axum", "tower-http", "rust-embed"]
sources = []
ollama-live-smoke = []

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
wiremock = "0.6"
