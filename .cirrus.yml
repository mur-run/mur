freebsd_feasibility_spike_task:
  name: freebsd-feasibility-spike-${CIRRUS_ARCH}
  only_if: >-
    $CIRRUS_BRANCH =~ 'ci/freebsd-spike-.*' &&
    $CIRRUS_PR == ''
  timeout_in: 120m
  matrix:
    - env:
        CIRRUS_ARCH: amd64
      freebsd_instance:
        image_family: freebsd-15-1
        architecture: amd64
    - env:
        CIRRUS_ARCH: arm64
      freebsd_instance:
        image_family: freebsd-15-1
        architecture: arm64
  install_script:
    - pkg install -y bash
  probe_script:
    - env EXPECTED_ARCH="$CIRRUS_ARCH" REPORT="$CIRRUS_WORKING_DIR/freebsd-spike-report.txt" sh scripts/freebsd-spike.sh
  always:
    report_artifacts:
      path: freebsd-spike-report.txt
      type: text/plain
