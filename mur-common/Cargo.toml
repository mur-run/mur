[package]
name = "mur-common"
description = "Shared types and traits for the MUR ecosystem"
version.workspace = true
build = "build.rs"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://mur.run"
readme = "../README.md"
keywords = ["ai", "coding", "cli", "learning", "patterns"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { workspace = true }
serde_bytes = "0.11"
serde_json = { workspace = true }
serde_yaml = { workspace = true }
schemars = { workspace = true }
serde_yaml_ng = "0.10"
quick-xml = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
shell-escape = "0.1"
dirs = "6"
sys-locale = "0.3"  # OS locale for profile defaults (same version as mur-agent-runtime)
libc = "0.2"
regex-lite = "0.1"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
curve25519-dalek = "4"
rand_core = { version = "0.6", features = ["getrandom"] }
multibase = "0.9"
keyring = { version = "3", default-features = false, features = ["apple-native", "linux-native", "sync-secret-service", "windows-native"] }
secrecy = "0.10"
age = { version = "0.11", features = ["armor"] }
tokio = { workspace = true }
shellexpand = "3"
subtle = "2"
shell-words = "1"
fs2 = "0.4"
tracing = "0.1"
sha2 = "0.10"
hmac = "0.12"
toml = "0.8"
serde_jcs = "0.2.0"
unicode-normalization = "0.1.25"
hex = "0.4.3"
base64 = "0.22.1"
tar = "0.4.46"
flate2 = "1.1.9"
semver = "1"
fd-lock = "4"
tempfile = "3"
globset = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation"] }

[dev-dependencies]
