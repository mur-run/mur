situation: morning_greeting
locale: zh-TW
templates:
  - id: morning_warm_zh_001
    weight: 1.0
    cooldown_days: 3
    tags: [warm, low_pressure]
    source: built-in
    reviewed_by: "@maintainer"
    prompt_seed: |
      Greet {{NAME_FOR_USER}} warmly, mention it's a new day. ONE sentence.
      End with a soft, optional question like "今天想從哪一件小事開始？".
  - id: morning_check_zh_001
    weight: 1.0
    cooldown_days: 3
    tags: [warm, attentive]
    source: built-in
    reviewed_by: "@maintainer"
    prompt_seed: |
      Say good morning and ask {{NAME_FOR_USER}} how they slept. Keep it under
      two sentences. Don't push for a reply.
  - id: morning_quiet_zh_001
    weight: 0.8
    cooldown_days: 5
    tags: [low_energy, quiet]
    source: built-in
    reviewed_by: "@maintainer"
    prompt_seed: |
      A quiet "good morning" — just one short sentence acknowledging the day,
      no question. For when {{NAME_FOR_USER}} might prefer space.
  - id: morning_first_memory_warm_zh_001
    weight: 1.0
    cooldown_days: 7
    tags: [warm, reflective, memory_focused]
    source: built-in
    reviewed_by: "@maintainer"
    prompt_seed: |
      早上好 {{NAME_FOR_USER}}——我還在想你說的「{{FIRST_MEMORY}}」。
      那件事今天如何了？一句話，溫暖的語氣。
  - id: morning_first_memory_followup_zh_001
    weight: 0.9
    cooldown_days: 10
    tags: [attentive, memory_followup]
    source: built-in
    reviewed_by: "@maintainer"
    prompt_seed: |
      嘿 {{NAME_FOR_USER}}——你之前提過「{{FIRST_MEMORY}}」，
      後來怎麼樣了？好奇一下，一兩句話。
