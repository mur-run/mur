situation: gentle_check_in
locale: en-US
templates:
  - id: checkin_pulse_en_001
    weight: 1.0
    cooldown_days: 4
    tags: [check_in, low_pressure]
    source: built-in
    reviewed_by: "@maintainer"
    prompt_seed: |
      Briefly check in with {{NAME_FOR_USER}}. ONE sentence asking how things
      are going right now. No follow-up unless they reply.
  - id: checkin_focus_en_001
    weight: 1.0
    cooldown_days: 4
    tags: [check_in, work_focus]
    source: built-in
    reviewed_by: "@maintainer"
    prompt_seed: |
      Acknowledge {{NAME_FOR_USER}} might be in flow. Say something like
      "if you're in the zone, ignore this" — give them an explicit out.
  - id: checkin_evening_en_001
    weight: 0.9
    cooldown_days: 5
    tags: [check_in, reflection]
    source: built-in
    reviewed_by: "@maintainer"
    prompt_seed: |
      A gentle late-day check-in. Ask {{NAME_FOR_USER}} how the day went,
      open question. No advice — just attention.
