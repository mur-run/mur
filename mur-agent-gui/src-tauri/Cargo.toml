[package]
name = "mur-agent-gui"
version = "2.5.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mur-run/mur"
description = "Tauri 2 desktop shell for a single mur agent"

# Mark as a standalone workspace so cargo doesn't walk past
# `.worktrees/<name>/Cargo.toml` (which excludes mur-agent-gui) and accidentally
# attach to the main repo's root workspace when building from a worktree.
[workspace]

# Library required by Tauri build for binding generation.
[lib]
name = "mur_agent_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mur-agent-gui"
path = "src/main.rs"

# Sandboxed image / PDF decoder subprocess. Spawned by the GUI, reads
# one DecodeRequest frame from stdin, writes one DecodeResponse frame
# to stdout, exits. Process isolation contains malicious decoder
# exploits to this bin only. See `src/bin/mur-agent-decoder.rs`.
[[bin]]
name = "mur-agent-decoder"
path = "src/bin/mur-agent-decoder.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-fs = "2"
# Companion → GUI bridge (D5) — debounced filesystem watcher on
# ~/.mur/agents/<name>/companion/inbox/.
notify = "6"
tauri-plugin-process = "2"

# Reuse the upstream library so admin commands and types match the CLI.
mur-core = { path = "../../mur-core" }
mur-common = { path = "../../mur-common" }
# `mur-agent-runtime` is needed for `durable::ledger::Ledger::scan_days`,
# the per-day JSONL scanner used by `companion_why_inner`. Schema-tolerant
# path: we deserialize as `serde_json::Value` so the GUI doesn't depend on
# the runtime's `OutboxEvent` enum surface.
mur-agent-runtime = { path = "../../mur-agent-runtime" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "6"
secrecy = "0.10"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["time", "signal", "macros", "sync", "rt-multi-thread", "io-util", "fs", "process"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
flate2 = "1"
tar = "0.4"
tempfile = "3"

# ───── voice (D1 / M1) ─────
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["copy-dylibs", "load-dynamic"] }
whisper-rs = { version = "0.14", default-features = false }
cpal = "0.16"
hound = "3"
dasp_ring_buffer = "0.11"
parking_lot = "0.12"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "pkcs8"] }
sha2 = "0.10"
hex = "0.4"
bs58 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures = "0.3"
async-trait = "0.1"
# Track C3 — sniff mime type for shared file/image paths so the
# ingestor can route binary kinds through `process_artifact`.
mime_guess = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
# Track C3 / M-c3.1 — `muragent-<slug>://share?...` URL scheme channel.
# `tauri-plugin-deep-link` provides the runtime handler; `base64` and
# `url` decode the inbound payload (URL_SAFE_NO_PAD, RFC 3986).
tauri-plugin-deep-link = "2"
base64 = "0.22"
url = "2"

# ───── multimodal decoder (D3 / M3) ─────
# `image` is consumed by `mur-agent-decoder` for PNG/JPEG/WebP decode.
# HEIC (libheif-rs) is deferred to M3.3.3 — requires `brew install libheif`
# / `apt install libheif-dev` and is not yet on the host.
# pdfium-render landed in M3.4.1 — extracts per-page text and flags any
# page with < 1pt glyphs as quarantined (invisible-text injection guard).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
unicode-segmentation = "1"
pdfium-render = { version = "0.8", features = ["sync"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# whisper.cpp Metal backend — Apple-only; enabling on Linux/Windows breaks
# CMake (it looks for the Foundation framework which only exists on macOS).
whisper-rs = { version = "0.14", default-features = false, features = ["metal"] }
# Track C3 / M-c3.3 — Services menu channel. `objc2` exposes the
# Objective-C runtime; `objc2-app-kit` and `objc2-foundation` give us
# NSPasteboard / NSApplication / NSString bindings used by the
# `NSServiceProviderProtocol` bridge in `src/send/services.rs`.
# Pinned to 0.3.x / 0.6.x to match the versions already pulled in
# transitively by `tauri` 2 (via `arboard`, `muda`, `global-hotkey`)
# — mixing major versions yields confusing trait-bound errors.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSPasteboard",
] }
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSData",
    "NSString",
    "NSError",
    "NSDictionary",
    "NSValue",
] }
# M3.5.2 — macOS Vision.framework OCR backend. `VNRecognizeTextRequest`
# + `VNImageRequestHandler` extract text from arbitrary PNG bytes via
# Apple's on-device OCR. The image-data variant of the request
# handler (`initWithData:options:`) accepts the PNG bytes directly,
# so we don't need a CGImage intermediate (and don't pull in
# `objc2-core-graphics`).
objc2-vision = { version = "0.3", features = [
    "VNRequest",
    "VNRecognizeTextRequest",
    "VNRequestHandler",
    "VNObservation",
] }

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.9"

[dev-dependencies]
tempfile = "3"
httpmock = "0.7"
rand = "0.8"

[features]
# By default we include the `custom-protocol` feature so the bundled
# webview can serve frontend assets.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
