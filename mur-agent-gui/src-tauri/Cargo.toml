[package]
name = "mur-agent-gui"
version = "2.4.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/mur-run/mur"
description = "Tauri 2 desktop shell for a single mur agent"

# Mark as a standalone workspace so cargo doesn't walk past
# `.worktrees/<name>/Cargo.toml` (which excludes mur-agent-gui) and accidentally
# attach to the main repo's root workspace when building from a worktree.
[workspace]

# Library required by Tauri build for binding generation.
[lib]
name = "mur_agent_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mur-agent-gui"
path = "src/main.rs"

# Sandboxed image / PDF decoder subprocess. Spawned by the GUI, reads
# one DecodeRequest frame from stdin, writes one DecodeResponse frame
# to stdout, exits. Process isolation contains malicious decoder
# exploits to this bin only. See `src/bin/mur-agent-decoder.rs`.
[[bin]]
name = "mur-agent-decoder"
path = "src/bin/mur-agent-decoder.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-fs = "2"
# Companion → GUI bridge (D5) — debounced filesystem watcher on
# ~/.mur/agents/<name>/companion/inbox/.
notify = "6"
tauri-plugin-process = "2"

# Reuse the upstream library so admin commands and types match the CLI.
mur-core = { path = "../../mur-core" }
mur-common = { path = "../../mur-common" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "6"
secrecy = "0.10"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["time", "signal", "macros", "sync", "rt-multi-thread", "io-util", "fs", "process"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
flate2 = "1"
tar = "0.4"
tempfile = "3"

# ───── voice (D1 / M1) ─────
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["copy-dylibs", "load-dynamic"] }
whisper-rs = { version = "0.14", default-features = false }
cpal = "0.16"
hound = "3"
dasp_ring_buffer = "0.11"
parking_lot = "0.12"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "pkcs8"] }
sha2 = "0.10"
hex = "0.4"
bs58 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures = "0.3"
async-trait = "0.1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"

# ───── multimodal decoder (D3 / M3) ─────
# `image` is consumed by `mur-agent-decoder` for PNG/JPEG/WebP decode.
# HEIC (libheif-rs) is deferred to M3.3.3 — requires `brew install libheif`
# / `apt install libheif-dev` and is not yet on the host.
# pdfium-render landed in M3.4.1 — extracts per-page text and flags any
# page with < 1pt glyphs as quarantined (invisible-text injection guard).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
unicode-segmentation = "1"
pdfium-render = { version = "0.8", features = ["sync"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# whisper.cpp Metal backend — Apple-only; enabling on Linux/Windows breaks
# CMake (it looks for the Foundation framework which only exists on macOS).
whisper-rs = { version = "0.14", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.9"

[dev-dependencies]
tempfile = "3"
httpmock = "0.7"
rand = "0.8"

[features]
# By default we include the `custom-protocol` feature so the bundled
# webview can serve frontend assets.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
