name: Release

on:
  push:
    tags: ['v*']
  # tag.yml pushes the tag with GITHUB_TOKEN, which suppresses the push event
  # (recursion guard), then dispatches this workflow at the tag ref — where
  # $GITHUB_REF_NAME is the tag name, same as under a human tag push.
  workflow_dispatch:

permissions:
  contents: write

# Required secrets:
#   APPLE_SIGNING_CERT       - base64-encoded Developer ID p12 bundle
#   APPLE_KEYCHAIN_PASSWORD  - password for the p12 above
#   APPLE_NOTARY_USER        - Apple ID email used for notarization
#   APPLE_NOTARY_PASSWORD    - app-specific password for that Apple ID
#   APPLE_TEAM_ID            - Apple Developer Team ID
#   APPLE_TEAM_NAME          - "common name" piece used in the codesign identity
#   CRATES_IO_TOKEN          - crates.io API token (publish-crates job)
#   HOMEBREW_TAP_TOKEN       - existing, used by update-homebrew job

jobs:
  validate-version:
    name: Validate tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check version consistency
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(grep '^version ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "❌ Tag version (v${TAG_VERSION}) does not match Cargo.toml version (${CARGO_VERSION})"
            echo ""
            echo "  Fix: bump workspace version in Cargo.toml to match the tag before pushing."
            echo "  Example: sed -i 's/version = \"${CARGO_VERSION}\"/version = \"${TAG_VERSION}\"/' Cargo.toml"
            echo ""
            exit 1
          fi
          echo "✅ Tag version v${TAG_VERSION} matches Cargo.toml"

  build:
    name: Build (${{ matrix.target }})
    needs: validate-version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120 # hung build ≠ 6h default
    # sccache: compile-level cache that survives the per-release Cargo.lock
    # version bump (which invalidates rust-cache's exact key every time).
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            name: mur-aarch64-apple-darwin
          # TODO: x86_64-apple-darwin cross-compile fails on macos-latest (ARM runner)
          # - target: x86_64-apple-darwin
          #   os: macos-latest
          #   name: mur-x86_64-apple-darwin
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: mur-x86_64-unknown-linux-gnu
          # TODO: fix cross-compile GLIBC issue with Rust 2024 edition
          # - target: aarch64-unknown-linux-gnu
          #   os: ubuntu-latest
          #   name: mur-aarch64-unknown-linux-gnu
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: mur-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6

      - name: Checkout mur-web
        uses: actions/checkout@v6
        with:
          repository: mur-run/mur-web
          path: mur-web-src

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Build mur-web dashboard
        run: |
          cd mur-web-src
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Run sccache
        uses: mozilla/sccache-action@v0.0.9

      - name: Install protobuf (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libdbus-1-dev libasound2-dev

      - name: Install protobuf (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protobuf (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - name: Install cross (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross

      # Exclude the build dirs from Defender real-time scanning — it scans every
      # .rlib/.o/.exe write and measurably slows the (compile-dominated) Windows
      # release build. Best-effort; never fail the job over it.
      - name: Windows Defender exclusions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($p in @("${{ github.workspace }}\target", "$env:USERPROFILE\.cargo")) {
            Add-MpPreference -ExclusionPath $p -ErrorAction SilentlyContinue
          }
          foreach ($e in @("rlib","rmeta","o","exe","pdb")) {
            Add-MpPreference -ExclusionExtension $e -ErrorAction SilentlyContinue
          }

      - name: Set release-marker env (macOS)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          echo "MUR_EMBED_RELEASE_MARKER=1" >> "$GITHUB_ENV"
          echo "MUR_APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          MUR_WEB_DIST: ${{ github.workspace }}/mur-web-src/dist

      - name: Build (cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --locked --target ${{ matrix.target }}
        env:
          MUR_WEB_DIST: ${{ github.workspace }}/mur-web-src/dist

      - name: Import Apple signing certs (macOS)
        if: matrix.target == 'aarch64-apple-darwin'
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_SIGNING_CERT }}
          p12-password: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}

      # Every binary in the tarball, not just the runtime. Measured on v2.70.0:
      # `mur`, `murmurd` and `mur-mcp-server` shipped `flags=0x20002(adhoc,
      # linker-signed)` — the Rust linker's default when nothing signs them —
      # while only mur-agent-runtime carried a Developer ID.
      #
      # That matters beyond tidiness: a Keychain Always-Allow grant binds to the
      # signing IDENTITY, and an ad-hoc signature has none, so the identity
      # degenerates to the binary's hash and every upgrade reads as a different
      # app. A background agent cannot re-prompt, so the secret silently
      # resolves to nothing (#866).
      #
      # Keep this list in step with the `tar czf` below — signing a binary that
      # is not shipped is harmless, but shipping one that is not signed is the
      # bug this fixes.
      - name: Sign macOS binaries
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          set -euo pipefail
          for b in mur mur-mcp-server murmurd mur-agent-runtime; do
            p="target/aarch64-apple-darwin/release/$b"
            codesign --force --options runtime --timestamp \
              --sign "Developer ID Application: $APPLE_TEAM_NAME ($APPLE_TEAM_ID)" \
              "$p"
            codesign --verify --verbose \
              -R "=anchor apple generic and certificate leaf[subject.OU] = \"$APPLE_TEAM_ID\"" \
              "$p"
          done
        env:
          APPLE_TEAM_NAME: ${{ secrets.APPLE_TEAM_NAME }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          # Ship mur-agent-runtime too: brew installs it as a sibling of `mur`, so
          # resolve_runtime_target finds the sibling and `brew upgrade` keeps the
          # runtime in sync. Without it, brew CLI users have no runtime and running
          # agents drift on a stale one (the runtime otherwise ships only in the Hub .app).
          tar czf ../../../${{ matrix.name }}.tar.gz mur mur-mcp-server murmurd mur-agent-runtime
          cd ../../..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/mur.exe,target/${{ matrix.target }}/release/mur-mcp-server.exe,target/${{ matrix.target }}/release/murmurd.exe,target/${{ matrix.target }}/release/mur-agent-runtime.exe -DestinationPath ${{ matrix.name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.zip

  package-macos:
    name: Package macOS (DMG + PKG)
    needs: build
    runs-on: macos-latest
    timeout-minutes: 60 # notarization wait can stall; bound it
    if: always() && needs.build.result == 'success'
    steps:
      - uses: actions/checkout@v6

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: mur-aarch64-apple-darwin

      - name: Extract binary from tar.gz
        # Extract into a dedicated dir: the tarball contains a `mur-mcp-server`
        # binary, but the checked-out source tree has a `mur-mcp-server/` crate
        # directory at the repo root. Extracting in place fails with
        # "Can't replace existing directory with non-directory".
        run: |
          mkdir -p dist
          tar xzf mur-aarch64-apple-darwin.tar.gz -C dist

      - name: Import Apple signing certs
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_SIGNING_CERT }}
          p12-password: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}

      - name: Stage pkg-root
        run: |
          mkdir -p pkg-root/usr/local/bin
          mkdir -p pkg-root/usr/local/share/doc/mur
          cp dist/mur pkg-root/usr/local/bin/mur
          cp dist/mur-mcp-server pkg-root/usr/local/bin/mur-mcp-server
          cp dist/murmurd pkg-root/usr/local/bin/murmurd
          chmod +x pkg-root/usr/local/bin/mur
          chmod +x pkg-root/usr/local/bin/mur-mcp-server
          chmod +x pkg-root/usr/local/bin/murmurd
          cp LICENSE pkg-root/usr/local/share/doc/mur/LICENSE
          mkdir -p scripts-pkg
          cat > scripts-pkg/postinstall <<'EOF'
          #!/bin/sh
          echo "MUR installed to /usr/local/bin/mur"
          echo "Run 'mur init' to get started."
          exit 0
          EOF
          chmod +x scripts-pkg/postinstall

      - name: Sign binary with hardened runtime
        run: |
          codesign --force --options runtime --timestamp \
            --sign "Developer ID Application: $APPLE_TEAM_NAME ($APPLE_TEAM_ID)" \
            pkg-root/usr/local/bin/mur \
            pkg-root/usr/local/bin/mur-mcp-server \
            pkg-root/usr/local/bin/murmurd
          codesign --verify --verbose pkg-root/usr/local/bin/mur \
            pkg-root/usr/local/bin/mur-mcp-server \
            pkg-root/usr/local/bin/murmurd
        env:
          APPLE_TEAM_NAME: ${{ secrets.APPLE_TEAM_NAME }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build .pkg
        run: |
          pkgbuild --root pkg-root \
            --identifier run.mur.cli \
            --version "${{ steps.version.outputs.version }}" \
            --scripts scripts-pkg/ \
            --install-location / \
            mur.pkg

      - name: Sign .pkg
        run: |
          productsign --sign "Developer ID Installer: $APPLE_TEAM_NAME ($APPLE_TEAM_ID)" \
            mur.pkg mur-aarch64-apple-darwin.pkg
        env:
          APPLE_TEAM_NAME: ${{ secrets.APPLE_TEAM_NAME }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Free disk space
        run: |
          df -h /
          echo "::group::Cleaning up large pre-installed tools"
          # Xcode simulators and runtimes are the biggest space hogs.
          sudo rm -rf /Library/Developer/CoreSimulator || true
          # Remove other large unused tools if they exist.
          rm -rf ~/Library/Developer/Xcode/iOS\ DeviceSupport || true
          rm -rf ~/Library/Developer/Xcode/watchOS\ DeviceSupport || true
          echo "::endgroup::"
          df -h /

      - name: Create DMG
        run: |
          mkdir dmg-root
          cp mur-aarch64-apple-darwin.pkg dmg-root/
          # hdiutil -srcfolder auto-sizes sometimes underestimates on CI runners.
          # Use a two-step approach: create a generously-sized sparse image, mount
          # it, copy files manually, then detach and convert.
          hdiutil create -volname "MUR" -size 200m -fs HFS+ -layout NONE temp.sparseimage
          hdiutil attach -nobrowse temp.sparseimage
          cp -R dmg-root/* /Volumes/MUR/
          hdiutil detach /Volumes/MUR
          hdiutil convert temp.sparseimage -format UDZO -o mur-aarch64-apple-darwin.dmg
          rm temp.sparseimage

      - name: Sign DMG
        run: |
          codesign --sign "Developer ID Application: $APPLE_TEAM_NAME ($APPLE_TEAM_ID)" \
            mur-aarch64-apple-darwin.dmg
        env:
          APPLE_TEAM_NAME: ${{ secrets.APPLE_TEAM_NAME }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Notarize DMG
        run: |
          xcrun notarytool submit mur-aarch64-apple-darwin.dmg \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$NOTARY_PWD" \
            --wait
          xcrun stapler staple mur-aarch64-apple-darwin.dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARY_USER }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PWD: ${{ secrets.APPLE_NOTARY_PASSWORD }}

      - name: Verify Gatekeeper acceptance
        run: spctl -a -t open --context context:primary-signature mur-aarch64-apple-darwin.dmg

      - name: Upload DMG + PKG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mur-macos-installer
          path: |
            mur-aarch64-apple-darwin.pkg
            mur-aarch64-apple-darwin.dmg

  hub-macos:
    name: Build MUR Hub (macOS arm64)
    needs: validate-version
    # macos-latest (not macos-14): the macos-14 image's current toolchain makes
    # ggml's CMake CPU detection fail and fall back to `-mcpu=native`, which its
    # clang rejects (whisper-rs-sys build). The CI Hub job builds whisper fine on
    # macos-latest; both are Apple-Silicon runners so the aarch64 target is native.
    runs-on: macos-latest
    timeout-minutes: 120 # cold Hub build ≈ 20 min; whisper/ggml can be slow
    env:
      # tauri-cli has no binstall-compatible prebuilt for this version, so a
      # plain install recompiles it from source (~10 min) every release. Pin the
      # version and cache the compiled binary; bump this to upgrade the CLI.
      TAURI_CLI_VERSION: "2.11.3"
      # sccache: compile-level cache that survives the per-release Cargo.lock
      # version bump. Covers both the sidecar build and the tauri (hub-gui)
      # build below.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v6

      # Under `cargo build --target aarch64-apple-darwin`, ggml's CMake CPU
      # detection (in the whisper-rs-sys build) fails and falls back to
      # `-mcpu=native`, which Xcode 16.4's clang rejects. Force GGML_NATIVE=OFF
      # (generic ARM flags, no `-mcpu=native`) via a CMake toolchain file — the
      # `cmake` crate forwards CMAKE_TOOLCHAIN_FILE. The file sets no
      # CMAKE_SYSTEM_NAME, so it does not trigger cross-compile mode.
      - name: Disable ggml native arch (avoid unsupported -mcpu=native)
        run: |
          echo 'set(GGML_NATIVE OFF CACHE BOOL "" FORCE)' > "$RUNNER_TEMP/ggml-no-native.cmake"
          echo "CMAKE_TOOLCHAIN_FILE=$RUNNER_TEMP/ggml-no-native.cmake" >> "$GITHUB_ENV"

      - name: Get Hub version from tag
        id: hub_version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp Hub version into tauri.conf.json
        run: |
          VERSION="${{ steps.hub_version.outputs.version }}"
          cd mur-hub-gui/src-tauri
          tmp=$(mktemp)
          jq --arg v "$VERSION" '.version = $v' tauri.conf.json > "$tmp" && mv "$tmp" tauri.conf.json

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mur-hub-gui/ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      # rust-cache handles registry + git source + target dir layout.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            mur-hub-gui/src-tauri -> target
          # No restore-keys here: rust-cache@v2 has no such input (it was
          # silently ignored) — cross-key restore would need shared-key.
          key: hub-macos-${{ hashFiles('Cargo.lock', 'mur-hub-gui/src-tauri/Cargo.lock') }}

      - name: Run sccache
        uses: mozilla/sccache-action@v0.0.9

      - name: Install build tools
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install protobuf

      # Build Hub UI and mur sidecars in parallel — both are independent at this point.
      - name: Build Hub UI + mur sidecars (parallel)
        env:
          MUR_EMBED_RELEASE_MARKER: '1'
          MUR_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          (cd mur-hub-gui/ui && npm ci && npm run build) &
          UI_PID=$!
          cargo build --release --locked --target aarch64-apple-darwin -p mur-core -p mur-agent-runtime
          wait $UI_PID
          mkdir -p mur-hub-gui/src-tauri/binaries
          cp target/aarch64-apple-darwin/release/mur \
             mur-hub-gui/src-tauri/binaries/mur-aarch64-apple-darwin
          cp target/aarch64-apple-darwin/release/mur-agent-runtime \
             mur-hub-gui/src-tauri/binaries/mur-agent-runtime-aarch64-apple-darwin

      # Reuse pip wheels across runs so the heavy mlx-vlm + pyinstaller install
      # doesn't re-download/rebuild every release.
      - name: Cache pip (mlx-server build)
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: pip-mlx-server-${{ hashFiles('scripts/build-mlx-server.sh') }}
          restore-keys: pip-mlx-server-

      - name: Cache mlx-server binary
        id: mlx_cache
        uses: actions/cache@v4
        with:
          path: mur-hub-gui/src-tauri/binaries/mlx-server-aarch64-apple-darwin
          key: mlx-server-bin-${{ hashFiles('scripts/build-mlx-server.sh') }}

      - name: Build mlx-server sidecar
        if: steps.mlx_cache.outputs.cache-hit != 'true'
        run: bash scripts/build-mlx-server.sh aarch64-apple-darwin

      # The model is no longer bundled into the .dmg (slim build): the Hub
      # downloads it on first run into ~/.mur/models/. scripts/fetch-bundle-model.sh
      # remains as a dev/offline helper but is intentionally not run in CI.

      # Cache the compiled cargo-tauri so we pay the ~10-min source build only on
      # a cache miss (first run / version bump), not every release. The binary is
      # platform-specific, so the key is scoped to os + arch + pinned version.
      - name: Cache tauri CLI
        id: tauri_cli_cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: cargo-tauri-${{ env.TAURI_CLI_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install cargo-binstall
        if: steps.tauri_cli_cache.outputs.cache-hit != 'true'
        uses: cargo-bins/cargo-binstall@v1.21.1
      - name: Install tauri CLI
        if: steps.tauri_cli_cache.outputs.cache-hit != 'true'
        run: cargo binstall -y tauri-cli --version "${{ env.TAURI_CLI_VERSION }}"

      - name: Import Apple signing certs
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_SIGNING_CERT }}
          p12-password: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}

      - name: Sign agent-runtime sidecar
        run: |
          codesign --force --options runtime --timestamp \
            --sign "Developer ID Application: $APPLE_TEAM_NAME ($APPLE_TEAM_ID)" \
            mur-hub-gui/src-tauri/binaries/mur-agent-runtime-aarch64-apple-darwin
          codesign --verify --verbose -R "=anchor apple generic and certificate leaf[subject.OU] = \"$APPLE_TEAM_ID\"" mur-hub-gui/src-tauri/binaries/mur-agent-runtime-aarch64-apple-darwin
        env:
          APPLE_TEAM_NAME: ${{ secrets.APPLE_TEAM_NAME }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build, sign, bundle .dmg
        env:
          APPLE_TEAM_NAME: ${{ secrets.APPLE_TEAM_NAME }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: ${{ secrets.APPLE_TEAM_NAME }} (${{ secrets.APPLE_TEAM_ID }})"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd mur-hub-gui/src-tauri
          cargo tauri build --target aarch64-apple-darwin

      - name: Notarize + staple
        run: |
          DMG=$(find mur-hub-gui/src-tauri/target -name "*.dmg" | head -n1)
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$NOTARY_PWD" \
            --wait
          xcrun stapler staple "$DMG"
          mkdir -p dist && cp "$DMG" "dist/MUR-Hub-aarch64-apple-darwin.dmg"
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARY_USER }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PWD: ${{ secrets.APPLE_NOTARY_PASSWORD }}

      - name: Verify Gatekeeper acceptance
        run: spctl -a -t open --context context:primary-signature "dist/MUR-Hub-aarch64-apple-darwin.dmg"

      - name: Collect updater artifacts + build latest.json
        run: |
          cp "$(find mur-hub-gui/src-tauri/target -name "*.app.tar.gz" | head -n1)" dist/MUR-Hub.app.tar.gz
          cp "$(find mur-hub-gui/src-tauri/target -name "*.app.tar.gz.sig" | head -n1)" dist/MUR-Hub.app.tar.gz.sig
          SIG=dist/MUR-Hub.app.tar.gz.sig
          VERSION="${{ steps.hub_version.outputs.version }}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > dist/latest.json <<JSON
          {
            "version": "$VERSION",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "darwin-aarch64": {
                "url": "https://github.com/mur-run/mur/releases/download/v$VERSION/MUR-Hub.app.tar.gz",
                "signature": "$(cat "$SIG")"
              }
            }
          }
          JSON

      - name: Upload DMG + updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mur-hub-macos
          path: |
            dist/MUR-Hub-aarch64-apple-darwin.dmg
            dist/MUR-Hub.app.tar.gz
            dist/MUR-Hub.app.tar.gz.sig
            dist/latest.json

  release:
    name: Publish Release
    needs: [build, package-macos, hub-macos]
    if: always() && contains(needs.build.result, 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create checksums
        # Hash every published *binary* artifact, `.pkg`/`.dmg` included: they
        # were uploaded but never listed, so the two macOS installers were the
        # only downloads a user could not verify. `.sig`/`latest.json` stay out
        # — they are the Tauri updater's own signed chain, checked against its
        # embedded pubkey rather than against this file.
        #
        # nullglob because this job publishes even when `package-macos` /
        # `hub-macos` fail (see `if:` above), so the macOS globs may legitimately
        # match nothing. An entirely empty set still fails: a release page with
        # an empty checksums.txt is a silent failure.
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=( ./*.tar.gz ./*.zip ./*.pkg ./*.dmg )
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "::error::no release artifacts to checksum"
            exit 1
          fi
          sha256sum "${artifacts[@]}" > checksums.txt
          test -s checksums.txt
          cat checksums.txt

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          # Auto-notes list the PRs merged since the previous tag. Every
          # change lands via a conventional-title PR, so this IS the
          # changelog — the hand-written CHANGELOG.md died at v2.10.0.
          generate_release_notes: true
          files: |
            *.tar.gz
            *.zip
            *.pkg
            *.dmg
            *.sig
            latest.json
            checksums.txt

  update-homebrew:
    name: Update Homebrew Tap
    needs: release
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Wait for release assets
        run: sleep 10

      - name: Get SHA256
        id: sha
        run: |
          URL="https://github.com/mur-run/mur/releases/download/${GITHUB_REF_NAME}/mur-aarch64-apple-darwin.tar.gz"
          SHA=$(curl -sL "$URL" | sha256sum | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Update formula
        uses: actions/checkout@v6
        with:
          repository: mur-run/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Write updated formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ steps.sha.outputs.sha256 }}"
          cat > homebrew-tap/Formula/mur.rb << 'FORMULA'
          class Mur < Formula
            desc "Invisible continuous learning system for AI coding assistants"
            homepage "https://github.com/mur-run/mur"
            license "MIT"
            version "VERSION_PLACEHOLDER"

            on_macos do
              on_arm do
                url "https://github.com/mur-run/mur/releases/download/vVERSION_PLACEHOLDER/mur-aarch64-apple-darwin.tar.gz"
                sha256 "SHA_PLACEHOLDER"
              end
            end

            def install
              bin.install "mur"
              bin.install "mur-mcp-server"
              bin.install "murmurd"
              bin.install "mur-agent-runtime"
              bin.install_symlink "mur" => "murmur"
            end

            test do
              assert_match "mur 2", shell_output("#{bin}/mur --version")
            end
          end
          FORMULA
          sed -i "s/VERSION_PLACEHOLDER/$VERSION/g" homebrew-tap/Formula/mur.rb
          sed -i "s/SHA_PLACEHOLDER/$SHA/g" homebrew-tap/Formula/mur.rb
          # Remove leading whitespace from heredoc
          sed -i 's/^          //' homebrew-tap/Formula/mur.rb

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/mur.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "mur ${{ steps.version.outputs.version }}"
          git push

  # No installer-deploy job here on purpose. install.sh / install.ps1 are
  # served from mur-run/mur.run-website (public/), which is what mur.run
  # actually resolves to. This job used to copy scripts/install.* to the
  # gh-pages branch, which stopped serving the domain when it moved to
  # Vercel — so it published corrected installers where nobody could fetch
  # them while the live ones stayed broken. Change the installer there.

  publish-crates:
    name: Publish to crates.io
    needs: release
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60 # ~20 crates published sequentially with index waits
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libdbus-1-dev libasound2-dev

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish mur-common
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -A "mur-ci/1.0" "https://crates.io/api/v1/crates/mur-common/$VERSION")
          if [ "$STATUS" = "200" ]; then
            echo "mur-common $VERSION already published, skipping"
          else
            cargo publish -p mur-common --token "${CRATES_IO_TOKEN}"
          fi
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      # Only mur-common is published. Everything below it (mur-compress,
      # mur-channel, mur-open-items, mur-agent-runtime) is `publish = false`,
      # and mur-core depends on all of them, so `cargo publish -p mur-core`
      # cannot succeed. It used to run here under `continue-on-error`, which
      # meant it failed on every release since 0.2.0 and said nothing.
      # The user-facing artifact is the `mur` binary — Homebrew and the
      # installer — not the library. See issue #773.
