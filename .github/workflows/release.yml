name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            name: mur-aarch64-apple-darwin
          # TODO: x86_64-apple-darwin cross-compile fails on macos-latest (ARM runner)
          # - target: x86_64-apple-darwin
          #   os: macos-latest
          #   name: mur-x86_64-apple-darwin
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: mur-x86_64-unknown-linux-gnu
          # TODO: fix cross-compile GLIBC issue with Rust 2024 edition
          # - target: aarch64-unknown-linux-gnu
          #   os: ubuntu-latest
          #   name: mur-aarch64-unknown-linux-gnu
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: mur-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6

      - name: Checkout mur-web
        uses: actions/checkout@v6
        with:
          repository: mur-run/mur-web
          path: mur-web-src

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Build mur-web dashboard
        run: |
          cd mur-web-src
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install protobuf (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libdbus-1-dev libasound2-dev

      - name: Install protobuf (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protobuf (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - name: Install cross (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }}
        env:
          MUR_WEB_DIST: ${{ github.workspace }}/mur-web-src/dist

      - name: Build (cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --target ${{ matrix.target }}
        env:
          MUR_WEB_DIST: ${{ github.workspace }}/mur-web-src/dist

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.name }}.tar.gz mur
          cd ../../..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/mur.exe -DestinationPath ${{ matrix.name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.zip

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create checksums
        run: sha256sum *.tar.gz *.zip 2>/dev/null > checksums.txt || true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
            checksums.txt

  update-homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Wait for release assets
        run: sleep 10

      - name: Get SHA256
        id: sha
        run: |
          URL="https://github.com/mur-run/mur/releases/download/${GITHUB_REF_NAME}/mur-aarch64-apple-darwin.tar.gz"
          SHA=$(curl -sL "$URL" | sha256sum | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Update formula
        uses: actions/checkout@v6
        with:
          repository: mur-run/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Write updated formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ steps.sha.outputs.sha256 }}"
          cat > homebrew-tap/Formula/mur.rb << 'FORMULA'
          class Mur < Formula
            desc "Invisible continuous learning system for AI coding assistants"
            homepage "https://github.com/mur-run/mur"
            license "MIT"
            version "VERSION_PLACEHOLDER"

            on_macos do
              on_arm do
                url "https://github.com/mur-run/mur/releases/download/vVERSION_PLACEHOLDER/mur-aarch64-apple-darwin.tar.gz"
                sha256 "SHA_PLACEHOLDER"
              end
            end

            def install
              bin.install "mur"
            end

            test do
              assert_match "mur 2", shell_output("#{bin}/mur --version")
            end
          end
          FORMULA
          sed -i "s/VERSION_PLACEHOLDER/$VERSION/g" homebrew-tap/Formula/mur.rb
          sed -i "s/SHA_PLACEHOLDER/$SHA/g" homebrew-tap/Formula/mur.rb
          # Remove leading whitespace from heredoc
          sed -i 's/^          //' homebrew-tap/Formula/mur.rb

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/mur.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "mur ${{ steps.version.outputs.version }}"
          git push
