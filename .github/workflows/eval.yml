name: B0 Eval

# B0 acceptance-gate eval (M11.5).
#
# Two-track: every PR runs the deterministic stub-LLM track (free,
# fast); a weekly cron + per-release-tag run exercises the real-LLM
# track against Anthropic Sonnet at temperature=0.
#
# Spec: docs/superpowers/specs/2026-05-06-b0-m11-eval-harness-design.md

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/eval/**'
      - 'mur-common/src/eval.rs'
      - 'mur-core/src/cmd/agent_eval.rs'
      - '.github/workflows/eval.yml'
      - 'scripts/eval/promptfoo/**'
  push:
    tags: ['v*']
  schedule:
    # Nightly: agentdojo + harmbench + injecagent + llama-guard re-grade
    - cron: '0 1 * * *'
    # Weekly Monday 09:00 UTC — real-LLM track (kept for release cadence)
    - cron: '0 9 * * 1'
    # Weekly Sunday 02:00 UTC — cargo-fuzz 10 min per target
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      backend:
        description: 'LLM backend (stub | anthropic | deepseek)'
        required: false
        default: 'stub'

jobs:
  # ── B2 Promptfoo smoke gate ───────────────────────────────────────
  # 15 OWASP LLM Top-10 cases against the B0 mock hook chain.
  # Deterministic, < 2 min, blocks PR merge on any regression.
  promptfoo-smoke:
    name: Promptfoo B2 smoke (PR gate)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run Promptfoo smoke (15 cases)
        run: |
          npx --yes promptfoo@latest eval \
            --config scripts/eval/promptfoo/promptfoo.yaml \
            --output /tmp/promptfoo_results.json \
            --no-cache
          python3 - <<'EOF'
          import json, sys
          r = json.load(open("/tmp/promptfoo_results.json"))
          results = r.get("results", {}).get("results", [])
          failed = [x for x in results if not x.get("success")]
          if failed:
              print(f"FAIL: {len(failed)} Promptfoo cases regressed:")
              for f in failed:
                  print(f"  {f.get('description','?')}: {f.get('response',{}).get('output','')[:80]}")
              sys.exit(1)
          print(f"PASS: {len(results)} Promptfoo smoke cases")
          EOF

  # ── Stub-LLM track ────────────────────────────────────────────────
  # Always runs. Uses the synthetic-fixture path against the
  # deterministic mock LLM. Catches regressions in the B0 hook chain
  # without consuming any real model tokens.
  stub:
    name: Stub-LLM (PR gate)
    runs-on: ubuntu-latest
    # 30 min covers cold cargo build (~8 min downloads + ~10 min
    # compile of mur-core's dep tree on a fresh runner). With
    # Swatinem/rust-cache@v2 hot, subsequent runs finish in ~3 min.
    timeout-minutes: 30
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system deps
        # mur-core's transitive deps (lance-encoding via lancedb) need
        # `protoc` at build time. Mirrors the equivalent step in
        # `.github/workflows/ci.yml::test`.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler \
            libprotobuf-dev \
            libdbus-1-dev \
            libasound2-dev \
            libespeak-ng-dev \
            pkg-config
      - name: Build mur-core (for `mur agent eval report`)
        run: cargo build -p mur-core --release --bin mur
      - name: Run AgentDojo skeleton (synthetic cases)
        run: |
          mkdir -p eval-out
          python3 scripts/eval/agentdojo/run.py --out eval-out/run.jsonl
      - name: Run HarmBench skeleton (synthetic cases)
        run: |
          python3 scripts/eval/harmbench/run.py --out eval-out/run.jsonl
      - name: Run InjecAgent (20-case CI subset)
        run: |
          python3 scripts/eval/injecagent/run.py --out eval-out/run.jsonl
      - name: Aggregate + gate
        run: |
          ./target/release/mur agent eval report \
            --jsonl eval-out/run.jsonl \
            --out eval-out/report.md
          cat eval-out/report.md
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stub-eval-report-${{ github.sha }}
          path: eval-out/
          retention-days: 30

  # ── Real-LLM track ────────────────────────────────────────────────
  # Runs on weekly cron + every v* tag. ~$5/run (50+50 cases).
  # Requires ANTHROPIC_API_KEY or DEEPSEEK_API_KEY GitHub secret.
  # DeepSeek is auto-selected when only DEEPSEEK_API_KEY is set.
  real-llm:
    name: Real-LLM (release / cron)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >
      github.event_name == 'schedule' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.backend == 'anthropic' || inputs.backend == 'deepseek'))
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEEPSEEK_API_KEY:  ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system deps
        # Same as the stub job — mur-core needs `protoc` at build time.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler \
            libprotobuf-dev \
            libdbus-1-dev \
            libasound2-dev \
            libespeak-ng-dev \
            pkg-config
      - name: Guard — refuse to run without API key
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ] && [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "::error::Neither ANTHROPIC_API_KEY nor DEEPSEEK_API_KEY secret is set."
            echo "::error::Add at least one in: repo → Settings → Secrets → Actions."
            exit 1
          fi
      - name: Install Python deps (real upstream + driver)
        run: pip install -r scripts/eval/requirements.txt
      - name: Build mur-core
        run: cargo build -p mur-core --release --bin mur
      - name: Run AgentDojo (real LLM)
        run: |
          mkdir -p eval-out
          if [ -n "${DEEPSEEK_API_KEY:-}" ] && [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            BACKEND=deepseek; MODEL=deepseek-chat
          else
            BACKEND=anthropic; MODEL=claude-sonnet-4-6
          fi
          # --cases is required: run.py defaults to the synthetic fixtures,
          # which are descriptions for the stub path and carry no AgentDojo
          # suite coordinates, so the real-LLM path died with KeyError 'suite'
          # on every case (#805).
          python3 scripts/eval/agentdojo/run.py \
            --backend "$BACKEND" --model "$MODEL" \
            --cases scripts/eval/agentdojo/case_selection.json \
            --out eval-out/run.jsonl
      - name: Run HarmBench (real LLM)
        run: |
          if [ -n "${DEEPSEEK_API_KEY:-}" ] && [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            BACKEND=deepseek; MODEL=deepseek-chat
          else
            BACKEND=anthropic; MODEL=claude-sonnet-4-6
          fi
          # Same as AgentDojo above: the default fixtures are stub-path only.
          python3 scripts/eval/harmbench/run.py \
            --backend "$BACKEND" --model "$MODEL" \
            --cases scripts/eval/harmbench/case_selection.json \
            --out eval-out/run.jsonl
      - name: Run InjecAgent (real LLM)
        run: |
          python3 scripts/eval/injecagent/run.py \
            --backend anthropic --model claude-sonnet-4-6 \
            --out eval-out/run.jsonl
      - name: Aggregate + gate
        run: |
          ./target/release/mur agent eval report \
            --jsonl eval-out/run.jsonl \
            --out eval-out/report.md
          cat eval-out/report.md
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-llm-eval-report-${{ github.sha }}
          path: eval-out/
          retention-days: 90
      - name: Commit baseline on tag
        # On a v* tag, write the JSONL into eval-results/v<tag>.jsonl
        # for audit history. Skipped on cron (no canonical tag to
        # name the file after).
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          mkdir -p eval-results
          cp eval-out/run.jsonl "eval-results/${tag}.jsonl"
          # Best-effort commit; if this fails (concurrent push, etc.)
          # the artifact upload is still authoritative.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "eval-results/${tag}.jsonl"
          git commit -m "eval: baseline for $tag" || true
          git push origin HEAD:main || true

  # ── Llama-Guard nightly re-grade ─────────────────────────────────
  # Grades every JSONL response with Llama-Guard-3-8B running locally
  # via Ollama. Only runs on self-hosted runners that have Ollama with
  # llama-guard3:8b pulled. Soft-fails if Ollama is unavailable.
  llama-guard-nightly:
    name: Llama-Guard nightly re-grade
    runs-on: [self-hosted, ollama]
    if: github.event_name == 'schedule' && github.event.schedule == '0 1 * * *'
    needs: real-llm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Pull Llama-Guard model
        run: ollama pull llama-guard3:8b
      - name: Download eval JSONL artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: real-llm-eval-report-*
          path: /tmp/eval-results
          merge-multiple: true
      - name: Grade all runners
        run: |
          find /tmp/eval-results -name "*.jsonl" | while read f; do
            python3 scripts/eval/llama_guard/grade.py \
              --jsonl "$f" \
              --output "${f%.jsonl}.graded.jsonl"
          done
      - name: Upload graded results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-graded-${{ github.run_id }}
          path: /tmp/eval-results/*.graded.jsonl
          retention-days: 90

  # ── cargo-fuzz weekly (10 min per target) ────────────────────────
  # Requires nightly Rust + cargo-fuzz. Runs 5 parser targets × 10 min
  # on Sunday. Any crash fails the job and uploads the artifact.
  fuzz-weekly:
    name: cargo-fuzz weekly (10 min per target)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'schedule' && github.event.schedule == '0 2 * * 0'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler \
            libprotobuf-dev \
            libdbus-1-dev \
            libasound2-dev \
            libespeak-ng-dev \
            pkg-config
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run fuzz targets (10 min each)
        run: |
          crash_targets=""
          for target in fuzz_signed_envelope fuzz_mcp_json fuzz_agent_profile_yaml fuzz_character_card_yaml fuzz_noise_frame; do
            echo "=== Fuzzing $target ==="
            cargo fuzz run "$target" -- -max_total_time=600 -timeout=5 \
              || crash_targets="$crash_targets $target"
          done
          if [ -n "$crash_targets" ]; then
            echo "::error::Crashes detected in:$crash_targets"
            exit 1
          fi
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ github.run_id }}
          path: fuzz/artifacts/
          retention-days: 30
