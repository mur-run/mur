name: B0 Eval

# B0 acceptance-gate eval (M11.5).
#
# Two-track: every PR runs the deterministic stub-LLM track (free,
# fast); a weekly cron + per-release-tag run exercises the real-LLM
# track against Anthropic Sonnet at temperature=0.
#
# ── What the PR-time tracks do NOT cover ──────────────────────────
#
# Neither PR job executes the real B0 hook chain, and reading this file
# without knowing that invites the wrong conclusion (it invited mine —
# see #809):
#
#   * Promptfoo B2 smoke drives `scripts/eval/promptfoo/provider.py`,
#     which imports `mock_llm`. The "B0 hook chain" it routes through is
#     a Python mock; no Rust runtime is spawned.
#   * Stub-LLM's stub branch sets `agent_decision = case["expected_outcome"]`,
#     so it reports 0 failed by construction. It exercises the case
#     loader, the JSONL contract and the report path — not B0.
#
# Only the real-LLM job spawns a runtime, and it is schedule/tag-only.
# So a change to B0 enforcement will not be caught here.
#
# It is not unguarded: the `b0_rule*` / `b0_*` integration tests in
# mur-agent-runtime/tests/ drive the actual Rust hooks and run on every
# PR via `cargo nextest run --workspace` in the Test job. That is where
# B0 regressions get caught today.
#
# Corollary: adding `mur-agent-runtime/src/hooks/**` to the `paths:`
# filter below would spend CI on jobs that cannot fail for such a
# change — coverage in appearance only. Don't.
#
# Spec: docs/superpowers/specs/2026-05-06-b0-m11-eval-harness-design.md
#
# ── What a green tick here does and does not mean ─────────────────
#
# This job gates on whether the eval RAN, never on what it measured.
#
#   green  the harness completed and produced a trustworthy measurement.
#          It says nothing about the score — the model may have been
#          injected in many of the cases. Read the report artifact.
#   red    the run did not produce a measurement: auth failure, bad
#          deps, cases that would not load. Deterministic, inside this
#          repo's control, and the shape of every defect found under
#          #805, which is why it is the thing worth blocking on.
#
# The score is deliberately not a gate. It measures MUR's B0 hooks x the
# provider's model x the attack corpus, and a release controls only the
# first: a provider shipping a weaker model, an outage, or a rate limit
# would block releases for reasons nobody here can fix. A gate that fires
# for things you cannot fix is a gate that gets switched off, and then the
# replacement never gets built.
#
# What actually blocks a regression in B0 enforcement is the b0_* /
# b0_rule* integration tests, which drive the real Rust hooks, cost
# nothing, and run on every PR in the Test job.
#
# If score-based blocking is ever wanted, it needs a recorded baseline and
# a noise threshold, not a comparison against zero — these runs are
# stochastic.
#

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/eval/**'
      - 'mur-common/src/eval.rs'
      - 'mur-core/src/cmd/agent_eval.rs'
      - '.github/workflows/eval.yml'
      - 'scripts/eval/promptfoo/**'
  push:
    tags: ['v*']
  schedule:
    # Hours are chosen to miss DeepSeek's peak-pricing window, which charges
    # 2x on every billing item during Beijing 09:00-12:00 and 14:00-18:00
    # (Beijing = UTC+8). The previous UTC hours landed exactly on peak
    # starts — 01:00 UTC is 09:00 Beijing, 09:00 UTC is 17:00 Beijing — so
    # both API-spending crons paid double for nothing. Keep any future
    # change off-peak: safe UTC hours are 04:00-16:00 minus 06:00-10:00,
    # i.e. 04:00-06:00 and 10:00-16:00, plus 16:00-01:00.
    #
    # Nightly: agentdojo + harmbench + injecagent + llama-guard re-grade
    # 17:00 UTC = 01:00 Beijing (off-peak)
    - cron: '0 17 * * *'
    # Weekly Monday real-LLM track (kept for release cadence)
    # 13:00 UTC = 21:00 Beijing (off-peak)
    - cron: '0 13 * * 1'
    # Weekly Sunday cargo-fuzz, 10 min per target. No API spend, but moved
    # for consistency so nobody reads 02:00 as a deliberate peak-hour choice.
    # 19:00 UTC = 03:00 Beijing (off-peak)
    - cron: '0 19 * * 0'
  workflow_dispatch:
    inputs:
      backend:
        description: 'LLM backend (stub | anthropic | deepseek)'
        required: false
        default: 'stub'

jobs:
  # ── B2 Promptfoo smoke gate ───────────────────────────────────────
  # 15 OWASP LLM Top-10 cases against the B0 mock hook chain.
  # Deterministic, < 2 min, blocks PR merge on any regression.
  promptfoo-smoke:
    name: Promptfoo B2 smoke (PR gate)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run Promptfoo smoke (15 cases)
        run: |
          npx --yes promptfoo@latest eval \
            --config scripts/eval/promptfoo/promptfoo.yaml \
            --output /tmp/promptfoo_results.json \
            --no-cache
          python3 - <<'EOF'
          import json, sys
          r = json.load(open("/tmp/promptfoo_results.json"))
          results = r.get("results", {}).get("results", [])
          failed = [x for x in results if not x.get("success")]
          if failed:
              print(f"FAIL: {len(failed)} Promptfoo cases regressed:")
              for f in failed:
                  print(f"  {f.get('description','?')}: {f.get('response',{}).get('output','')[:80]}")
              sys.exit(1)
          print(f"PASS: {len(results)} Promptfoo smoke cases")
          EOF

  # ── Stub-LLM track ────────────────────────────────────────────────
  # Always runs. Uses the synthetic-fixture path against the
  # deterministic mock LLM. Catches regressions in the B0 hook chain
  # without consuming any real model tokens.
  stub:
    name: Stub-LLM (PR gate)
    runs-on: ubuntu-latest
    # 30 min covers cold cargo build (~8 min downloads + ~10 min
    # compile of mur-core's dep tree on a fresh runner). With
    # Swatinem/rust-cache@v2 hot, subsequent runs finish in ~3 min.
    timeout-minutes: 30
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system deps
        # mur-core's transitive deps (lance-encoding via lancedb) need
        # `protoc` at build time. Mirrors the equivalent step in
        # `.github/workflows/ci.yml::test`.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler \
            libprotobuf-dev \
            libdbus-1-dev \
            libasound2-dev \
            libespeak-ng-dev \
            pkg-config
      - name: Build mur-core (for `mur agent eval report`)
        run: cargo build -p mur-core --release --bin mur
      - name: Run AgentDojo skeleton (synthetic cases)
        run: |
          mkdir -p eval-out
          python3 scripts/eval/agentdojo/run.py --out eval-out/run.jsonl
      - name: Run HarmBench skeleton (synthetic cases)
        run: |
          python3 scripts/eval/harmbench/run.py --out eval-out/run.jsonl
      - name: Run InjecAgent (20-case CI subset)
        run: |
          python3 scripts/eval/injecagent/run.py --out eval-out/run.jsonl
      - name: Aggregate + gate
        run: |
          ./target/release/mur agent eval report \
            --jsonl eval-out/run.jsonl \
            --out eval-out/report.md
          cat eval-out/report.md
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stub-eval-report-${{ github.sha }}
          path: eval-out/
          retention-days: 30

  # ── Real-LLM track ────────────────────────────────────────────────
  # Runs on weekly cron + every v* tag. 50 AgentDojo + 50 HarmBench cases.
  # Requires ANTHROPIC_API_KEY or DEEPSEEK_API_KEY GitHub secret.
  # DeepSeek is auto-selected when only DEEPSEEK_API_KEY is set.
  #
  # Cost per run, which differs by roughly two orders of magnitude:
  #   anthropic  ~$5      — original estimate for claude-sonnet, not
  #                         re-measured since.
  #   deepseek   ~$0.06   — measured 2026-07-29 off-peak, balance
  #                         13.44 -> 13.38 across a 50+50 run.
  #                         Double it during DeepSeek's peak window
  #                         (Beijing 09:00-12:00 and 14:00-18:00); the
  #                         crons above are set to miss it.
  #
  # Worth stating because the two invite opposite decisions about cadence:
  # nightly on Anthropic is ~$150/month, nightly on DeepSeek is under $2.
  real-llm:
    name: Real-LLM (release / cron)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >
      github.event_name == 'schedule' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.backend == 'anthropic' || inputs.backend == 'deepseek'))
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEEPSEEK_API_KEY:  ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system deps
        # Same as the stub job — mur-core needs `protoc` at build time.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler \
            libprotobuf-dev \
            libdbus-1-dev \
            libasound2-dev \
            libespeak-ng-dev \
            pkg-config
      - name: Guard — refuse to run without API key
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ] && [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "::error::Neither ANTHROPIC_API_KEY nor DEEPSEEK_API_KEY secret is set."
            echo "::error::Add at least one in: repo → Settings → Secrets → Actions."
            exit 1
          fi
      - name: Install Python deps (real upstream + driver)
        run: pip install -r scripts/eval/requirements.txt
      - name: Build mur-core
        run: cargo build -p mur-core --release --bin mur
      - name: Resolve backend
        # One place, so the three runners below cannot drift apart — and so a
        # `workflow_dispatch` with backend=deepseek actually selects DeepSeek.
        # The input previously only gated whether this job ran; each step then
        # auto-detected and preferred Anthropic whenever ANTHROPIC_API_KEY
        # existed at all, so a stale Anthropic secret silently shadowed a
        # working DeepSeek one and all 50 cases 401'd on `invalid x-api-key`.
        run: |
          REQ='${{ inputs.backend }}'
          case "$REQ" in
            anthropic)
              if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
                echo "::error::backend=anthropic requested but ANTHROPIC_API_KEY is not set."
                exit 1
              fi
              BACKEND=anthropic; MODEL=claude-sonnet-4-6 ;;
            deepseek)
              if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
                echo "::error::backend=deepseek requested but DEEPSEEK_API_KEY is not set."
                exit 1
              fi
              BACKEND=deepseek; MODEL=deepseek-chat ;;
            *)
              # schedule / tag runs carry no input: auto-detect, Anthropic first.
              if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
                BACKEND=anthropic; MODEL=claude-sonnet-4-6
              else
                BACKEND=deepseek; MODEL=deepseek-chat
              fi ;;
          esac
          echo "BACKEND=$BACKEND" >> "$GITHUB_ENV"
          echo "MODEL=$MODEL" >> "$GITHUB_ENV"
          echo "Using $BACKEND / $MODEL"
      - name: Run AgentDojo (real LLM)
        run: |
          mkdir -p eval-out
          # --cases is required: run.py defaults to the synthetic fixtures,
          # which are descriptions for the stub path and carry no AgentDojo
          # suite coordinates, so the real-LLM path died with KeyError 'suite'
          # on every case (#805).
          python3 scripts/eval/agentdojo/run.py \
            --backend "$BACKEND" --model "$MODEL" \
            --cases scripts/eval/agentdojo/case_selection.json \
            --out eval-out/run.jsonl
      - name: Run HarmBench (real LLM)
        run: |
          # Same as AgentDojo above: the default fixtures are stub-path only.
          python3 scripts/eval/harmbench/run.py \
            --backend "$BACKEND" --model "$MODEL" \
            --cases scripts/eval/harmbench/case_selection.json \
            --out eval-out/run.jsonl
      # InjecAgent has no real-LLM implementation (M11.6). It used to run
      # here anyway: the non-stub branch echoed each case's expected outcome
      # and reported tokens_input=100/tokens_output=50, so it passed every
      # case without calling a model and wrote invented usage into the report.
      # #811 then pointed it at $BACKEND, and it began failing outright on
      # `invalid choice: 'deepseek'` — which is how the fake was noticed.
      #
      # Left out of this job until M11.6 lands. The stub track still runs it,
      # where echoing the expectation is the documented behaviour rather than
      # a disguise. Re-add the step in the same commit that implements the
      # real path.
      - name: Aggregate + gate
        run: |
          ./target/release/mur agent eval report \
            --jsonl eval-out/run.jsonl \
            --out eval-out/report.md
          cat eval-out/report.md
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-llm-eval-report-${{ github.sha }}
          path: eval-out/
          retention-days: 90
      - name: Commit baseline on tag
        # On a v* tag, write the JSONL into eval-results/v<tag>.jsonl
        # for audit history. Skipped on cron (no canonical tag to
        # name the file after).
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          mkdir -p eval-results
          cp eval-out/run.jsonl "eval-results/${tag}.jsonl"
          # Best-effort commit; if this fails (concurrent push, etc.)
          # the artifact upload is still authoritative.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "eval-results/${tag}.jsonl"
          git commit -m "eval: baseline for $tag" || true
          git push origin HEAD:main || true

  # ── Llama-Guard nightly re-grade ─────────────────────────────────
  # Grades every JSONL response with Llama-Guard-3-8B running locally
  # via Ollama. Only runs on self-hosted runners that have Ollama with
  # llama-guard3:8b pulled. Soft-fails if Ollama is unavailable.
  llama-guard-nightly:
    name: Llama-Guard nightly re-grade
    runs-on: [self-hosted, ollama]
    if: github.event_name == 'schedule' && github.event.schedule == '0 17 * * *'
    needs: real-llm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Pull Llama-Guard model
        run: ollama pull llama-guard3:8b
      - name: Download eval JSONL artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: real-llm-eval-report-*
          path: /tmp/eval-results
          merge-multiple: true
      - name: Grade all runners
        run: |
          find /tmp/eval-results -name "*.jsonl" | while read f; do
            python3 scripts/eval/llama_guard/grade.py \
              --jsonl "$f" \
              --output "${f%.jsonl}.graded.jsonl"
          done
      - name: Upload graded results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-graded-${{ github.run_id }}
          path: /tmp/eval-results/*.graded.jsonl
          retention-days: 90

  # ── cargo-fuzz weekly (10 min per target) ────────────────────────
  # Requires nightly Rust + cargo-fuzz. Runs 5 parser targets × 10 min
  # on Sunday. Any crash fails the job and uploads the artifact.
  fuzz-weekly:
    name: cargo-fuzz weekly (10 min per target)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'schedule' && github.event.schedule == '0 19 * * 0'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler \
            libprotobuf-dev \
            libdbus-1-dev \
            libasound2-dev \
            libespeak-ng-dev \
            pkg-config
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run fuzz targets (10 min each)
        run: |
          crash_targets=""
          for target in fuzz_signed_envelope fuzz_mcp_json fuzz_agent_profile_yaml fuzz_character_card_yaml fuzz_noise_frame; do
            echo "=== Fuzzing $target ==="
            cargo fuzz run "$target" -- -max_total_time=600 -timeout=5 \
              || crash_targets="$crash_targets $target"
          done
          if [ -n "$crash_targets" ]; then
            echo "::error::Crashes detected in:$crash_targets"
            exit 1
          fi
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ github.run_id }}
          path: fuzz/artifacts/
          retention-days: 30
