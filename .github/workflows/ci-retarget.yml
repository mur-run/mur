name: CI retarget

# ci.yml no longer listens for `edited` (it fired on every title/body edit).
# The one `edited` that matters is a stacked PR retargeted onto main: GitHub
# sends only `edited`, so without this nothing would run CI and the PR would
# sit BLOCKED on the required `CI pass` check.
#
# Why a separate workflow instead of a job-level `if:` in ci.yml: a skipped
# job reports Success, so an edit-only run would post a green `CI pass` on
# the head SHA and could mask a red or still-running real run. And ci.yml's
# concurrency group applies before any `if:`, so the edit would still cancel
# the in-flight run.
on:
  pull_request:
    branches: [main]
    types: [edited]

permissions:
  actions: write

jobs:
  dispatch-ci:
    name: Dispatch CI after base change
    # `changes.base` is only present when the base branch changed. Forks are
    # excluded: their head branch is not in this repo, so it cannot be
    # dispatched (and their token is read-only anyway).
    if: github.event.changes.base && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      # GITHUB_TOKEN-triggered events do not start workflows, except
      # workflow_dispatch and repository_dispatch, so this does start ci.yml.
      - name: Dispatch ci.yml on the PR head branch
        run: gh workflow run ci.yml --ref "$HEAD_REF"
