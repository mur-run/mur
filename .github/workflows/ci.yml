name: CI

# A title/body edit re-triggers this workflow. Those runs skip every job and
# only mirror the PR's real run in `CI pass` (last job). The distinct run name
# is how that job tells an edit run from a real one; keep it in sync with
# EDIT_RUN_NAME in the `Mirror the PR's real CI run` step.
run-name: ${{ (github.event.action == 'edited' && !github.event.changes.base) && 'CI (title/body edit)' || 'CI' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` fires on every title/body edit AND when a stacked PR is
    # retargeted onto main (GitHub sends only `edited`, with `changes.base`).
    # The retarget needs a real `pull_request` run: a `workflow_dispatch` CI
    # run goes green but its `CI pass` is not counted toward the PR's required
    # check, so the PR stays BLOCKED. A title/body edit (no `changes.base`) is
    # a no-op, see `Concurrency` and the per-job `if:` below.
    types: [opened, synchronize, reopened, edited]
  # Manual run on a branch. Treated like push: every job runs, because there
  # is no PR diff context for paths-filter.
  workflow_dispatch:

# A new commit on a PR obsoletes the in-flight run for the old commit —
# cancel it instead of finishing a 3-OS matrix nobody will read. A push:main
# run never cancels one already in progress (post-merge validation must
# complete), but GitHub keeps at most one pending run per group: a newer push
# replaces a still-queued one. That is fine — the newer commit contains the
# older one, so it is still validated. The group keys on the head branch, not
# refs/pull/N/merge. Both sides are prefixed with a repository: the PR's head
# repo, and this repo for push/dispatch. Without it a fork PR from its own
# `main` lands in ci-refs/heads/main and, since PR runs cancel in-progress,
# kills push:main validation; two forks with the same branch name would
# cancel each other.
#
# A title/body edit (`edited` without `changes.base`) gets its own `-edit`
# group and never cancels, so it cannot kill the PR's in-flight real run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('{0}/refs/heads/{1}', github.event.pull_request.head.repo.full_name, github.head_ref) || format('{0}/{1}', github.repository, github.ref) }}${{ (github.event.action == 'edited' && !github.event.changes.base) && '-edit' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !(github.event.action == 'edited' && !github.event.changes.base) }}

env:
  CARGO_TERM_COLOR: always
  # Disable incremental compilation across all CI jobs. Incremental adds a
  # dependency-graph metadata layer that defeats Swatinem/rust-cache and
  # bloats the cache key. From-scratch builds (which CI always is) are
  # ~15-20% faster without it.
  CARGO_INCREMENTAL: 0
  # Belt-and-suspenders for the test profile: even if a downstream PR
  # adds a [profile.test] override that re-enables debug, this env wins.
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_DEV_DEBUG: 0

# CACHE BUDGET: GitHub evicts least-recently-used caches once a repo passes
# 10 GB, and this workflow's Rust caches alone reached ~11.5 GB on main. The
# Windows test cache (~1.1 GB) kept being the one evicted, and each cold
# rebuild pushed that job from ~23m to 29-46m. So only the default branch
# saves (PRs restore main's entry instead of writing a duplicate), and jobs
# that stay off the critical path even when cold (GUI, Hub GUI on every OS,
# E2E quick) restore but never save. The critical path is Test (windows),
# 24-56m on main; Hub GUI Windows cold is 16-26m and E2E quick has peaked at
# 23m, so their 1.7 GB + 1.0 GB entries bought no wall time. Dropping them
# leaves room for release-cache-warm.yml's Hub sccache (~1.7 GB), which a
# release tag can only read while it survives on main.

jobs:
  # Decide what changed; downstream jobs gate on these outputs to skip
  # irrelevant work on docs-only / GUI-only / etc PRs. `push:main` always
  # runs everything (set 'true' below) so post-merge runs catch any
  # cross-cutting break.
  changes:
    name: Detect changed paths
    # Title/body edit: no job runs (everything else needs `changes`, or has
    # the same guard), so the edit posts nothing and cannot cancel or mask
    # the real run.
    if: ${{ !(github.event.action == 'edited' && !github.event.changes.base) }}
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      gui:  ${{ steps.filter.outputs.gui }}
      hub_gui: ${{ steps.filter.outputs.hub_gui }}
      e2e:  ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        # Skipped on workflow_dispatch: outputs stay empty and every job
        # runs via its `github.event_name != 'pull_request'` arm.
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          # Use the default `some` quantifier — at least ONE changed file
          # matching a filter's patterns is enough to trigger that filter.
          # The previous `predicate-quantifier: every` was a misreading of
          # the docs and required ALL changed files to match, so any
          # multi-file PR that touched even one file outside a filter's
          # patterns came back false → all jobs skipped → tests bypassed.
          #
          # For push:main events, paths-filter falls back to "match all
          # filters as true" automatically when there's no diff context,
          # so the post-merge safety net is preserved without `every`.
          filters: |
            code:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - '.config/**'
              - '.github/workflows/ci.yml'
              - 'scripts/**'
              - 'rust-toolchain.toml'
            gui:
              - 'mur-agent-gui/**'
              - 'mur-agent-runtime/**'
              - 'mur-core/**'
              - 'mur-common/**'
              - '.github/workflows/ci.yml'
            hub_gui:
              - 'mur-hub-gui/**'
              - 'mur-gui-core/**'
              - 'mur-core/**'
              - 'mur-common/**'
              - '.github/workflows/ci.yml'
            e2e:
              - 'mur-agent-gui/**'
              - 'mur-agent-runtime/**'
              - 'scripts/e2e/**'
              - '.github/workflows/ci.yml'

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60 # hung build ≠ 6h default; normal runs are well under
    strategy:
      fail-fast: false
      matrix:
        # macos-14: its image bundles Xcode 15.4, which we select below. The
        # default Xcode 16.4 (now on both macos-14 and macos-latest) breaks the
        # old vendored whisper.cpp build two ways — clang treats it as pre-C++11
        # ("no template 'function' in namespace std", ">>" errors) and the link
        # can't find clang_rt.osx (clang/17/lib/darwin missing). 15.4 builds it.
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Scope the cache to the runner image. GitHub image upgrades can
          # change the bundled MSVC/CMake generator (e.g. VS 17 2022 ->
          # VS 18 2026); without this, a restored target/ carries a stale
          # whisper-rs-sys CMakeCache.txt and CMake aborts on generator
          # mismatch. Keying on ImageVersion forces a fresh build on bump.
          key: ${{ env.ImageOS }}-${{ env.ImageVersion }}
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Select Xcode 15.4 (macOS)
        if: runner.os == 'macOS'
        # The runner's default Xcode 16.4 breaks the old vendored whisper.cpp
        # build (pre-C++11 clang errors) and the clang_rt.osx link. Xcode 15.4
        # (bundled on macos-14) builds + links it cleanly. Set before any cargo
        # build so build scripts (cc/cmake) use the right toolchain.
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler \
            libprotobuf-dev \
            libdbus-1-dev \
            libasound2-dev \
            libespeak-ng-dev \
            pkg-config \
            openssh-server
          # ssh_proxy_openssh runs an unprivileged sshd on loopback; Debian's
          # sshd refuses to start without its privilege-separation dir even
          # when not root. The test fails (not skips) under CI if sshd is absent.
          sudo mkdir -p /run/sshd
      - name: Install protobuf (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install protobuf (Windows)
        if: runner.os == 'Windows'
        # choco's community feed intermittently serves invalid XML, which makes
        # `choco install protoc` silently install 0 packages and then break the
        # lance-encoding build ("Could not find protoc"). Pull protoc straight
        # from GitHub releases instead — no community-feed dependency.
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Defender exclusions (Windows)
        # Cuts ~5-15% off Windows wall-clock when Defender real-time scan
        # is active on the runner. Harmless no-op if the runner image already
        # disabled it. continue-on-error so a Defender API change won't
        # break CI.
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}\target"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionProcess "rustc.exe"
          Add-MpPreference -ExclusionProcess "cargo.exe"
          Add-MpPreference -ExclusionProcess "link.exe"
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Create test signing identity (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/test-signing-identity.sh
      - name: Install pinned ast-grep
        # The ast_grep_search live tests (mur-mcp-server) run against the exact
        # binary MUR pins. MUR_REQUIRE_AST_GREP=1 makes a missing binary fail
        # instead of skip. Release zips are checked against pinned sha256s;
        # bump them together with AST_GREP_PINNED_VERSION.
        shell: bash
        env:
          AST_GREP_VERSION: "0.45.3"
        run: |
          set -euo pipefail
          grep -q "AST_GREP_PINNED_VERSION: &str = \"$AST_GREP_VERSION\"" \
            mur-common/src/config/search.rs \
            || { echo "::error::AST_GREP_VERSION drifted from AST_GREP_PINNED_VERSION"; exit 1; }
          case "$RUNNER_OS" in
            Linux)   t=x86_64-unknown-linux-gnu; exe=ast-grep
                     sha=f8ac830881339d1edee6b2652f54798c0f4da5a827f2db38a08ee31117783ce8 ;;
            macOS)   t=aarch64-apple-darwin; exe=ast-grep
                     sha=6d2279dea5bea2ad79c66ea93f5fe54ba926e398a8a26de76c56db68fe59eac6 ;;
            Windows) t=x86_64-pc-windows-msvc; exe=ast-grep.exe
                     sha=3751b7d6be7fd39a80df1180ffe7e053903dcf92d3190e5a8336ff1746af9059 ;;
          esac
          dir="$RUNNER_TEMP/ast-grep"
          zip="$RUNNER_TEMP/ast-grep.zip"
          curl -fsSL --retry 3 -o "$zip" \
            "https://github.com/ast-grep/ast-grep/releases/download/$AST_GREP_VERSION/app-$t.zip"
          if command -v sha256sum >/dev/null; then sum=sha256sum; else sum="shasum -a 256"; fi
          echo "$sha  $zip" | $sum -c -
          unzip -q -o "$zip" -d "$dir"
          bin="$dir/$exe"
          "$bin" --version
          if [ "$RUNNER_OS" = Windows ]; then bin=$(cygpath -w "$bin"); fi
          echo "MUR_AST_GREP_BIN=$bin" >> "$GITHUB_ENV"
          echo "MUR_REQUIRE_AST_GREP=1" >> "$GITHUB_ENV"
      # `cargo nextest run` builds + runs in one cargo invocation; `cargo
      # check --all` was a redundant pre-check whose .rmeta artifacts don't
      # help nextest's downstream test-binary build (different codegen
      # path). Dropping it saves ~66s on ubuntu, ~50s on macOS, ~200s on
      # Windows. `--profile ci` (in .config/nextest.toml) sets timeouts +
      # caps heavy-test (lance/qdrant/tantivy) concurrency to avoid OOM on
      # 16 GB Windows runners.
      - run: cargo nextest run --workspace --locked --profile ci
        env:
          # The large `mur` clap CLI needs a deeper per-thread stack to parse on
          # Windows, whose 1 MB default thread stack overflows during clap's
          # derive parsing (each test runs on its own thread). 16 MB is safe on
          # every OS; Linux/macOS already default higher.
          RUST_MIN_STACK: "16777216"
          # sandbox_e2e: a runner that cannot seal (sandbox_init / Landlock
          # unavailable) must fail, not skip — a skip there is a green that
          # proved nothing. The gated tests are #[cfg(unix)], so Windows ignores it.
          MUR_TEST_REQUIRE_SANDBOX: "1"
          # ssh_client_env_tests (O2): hosted Unix runners ship OpenSSH, so a
          # missing ssh must fail rather than skip. #[cfg(unix)]; Windows ignores it.
          MUR_TEST_REQUIRE_SSH: "1"
      - name: Socket-backed regression tests (Unix)
        # These tests early-return unless MUR_TEST_SOCKETS=1 (some sandboxes
        # forbid AF_UNIX connects), so the workspace run above passes them
        # without executing a line. Hosted Unix runners allow the sockets, so
        # run this narrow set with the opt-in: a green here means the bodies ran.
        # Reuses the test binaries built above; only these tests execute.
        if: runner.os != 'Windows'
        run: >-
          cargo nextest run -p mur-core --lib --locked --profile ci
          -E 'test(/cmd::fleet::loop_run::pause_tests::|a2a_dial::timeout_tests::|executor::dag::late_usage_tests::/)'
        env:
          RUST_MIN_STACK: "16777216"
          MUR_TEST_SOCKETS: "1"
      - name: mur-core under MUR_CHANNEL_REQUIRE_SIG (Linux)
        # Production can set MUR_CHANNEL_REQUIRE_SIG, which refuses any channel
        # write without a readable writer key (#2143). The workspace run above
        # leaves it unset, so a fixture that forgets to plant a key passes there
        # and only breaks for whoever exports the var (#2145). Rerun mur-core's
        # lib tests with it set; reuses the binaries built above. One OS is
        # enough: the signing policy has no platform-specific branch.
        if: runner.os == 'Linux'
        run: cargo nextest run -p mur-core --lib --locked --profile ci
        env:
          RUST_MIN_STACK: "16777216"
          MUR_CHANNEL_REQUIRE_SIG: "1"

  clippy:
    name: Clippy
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Headroom, because 45 proved too tight to recover from — NOT because a
    # cold build costs 45 minutes (measured: a cold run takes ~11 min).
    # Three runs in a row were killed at the 45m mark with "No cache found"
    # (main @962ac841 and two on #968) while a fourth cold run of the SAME
    # Rust code finished in 10m41s. Whatever slows a run down that far is
    # unexplained — runner contention is the suspicion, not a finding. What
    # made it stick was the feedback loop: a killed job never runs
    # rust-cache's save step, so every retry starts cold too, and re-running
    # can't clear it. The extra budget buys a bad run the chance to finish
    # and leave a cache behind. Still far below the 6h default, so a
    # genuinely hung build is still caught.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.ImageOS }}-${{ env.ImageVersion }}
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler \
            libprotobuf-dev \
            libdbus-1-dev \
            libasound2-dev \
            libespeak-ng-dev \
            pkg-config
      # `--no-deps` skips clippy on the ~800 dependency crates (linting them
      # serves no purpose since we can't fix them upstream from here). Saves
      # ~50-70s on a 125s job. Real lint coverage on our own code is unchanged.
      #
      # `--all-targets` includes tests, benches and examples. Without it, test
      # code is never linted and rots: the sweep that first added this flag had
      # ~40 accumulated violations to clear, two of which were real defects
      # (an error-loop `flatten()` and an undefined-truncate file open).
      - run: cargo clippy --all --all-targets --no-deps --locked -- -D warnings
      # This host is Linux, so `#[cfg(not(unix))]` paths are never linted above
      # and Windows-only dead code rots unseen (#1808). Cross-lint the crate
      # that carries the most platform-gated code for the Windows target; it is
      # a check, not a link, so no MSVC toolchain is needed. Scoped to
      # mur-track because the full workspace pulls native build scripts
      # (whisper, coreaudio) that cannot cross-compile here.
      - run: rustup target add x86_64-pc-windows-msvc
      - run: cargo clippy -p mur-track --all-targets --no-deps --locked --target x86_64-pc-windows-msvc -- -D warnings

  fmt:
    name: Format
    # Always run — fmt is 17s and catches commit-hook bypasses.
    if: ${{ !(github.event.action == 'edited' && !github.event.changes.base) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Repo-root allowlist (#1607)
        # Stray top-level files are how agent scratch output leaked into
        # merged PRs (#1602). Same script the pre-commit hook runs.
        run: sh scripts/check-repo-root.sh
      - run: cargo fmt --all -- --check
      - name: fmt mur-agent-gui (workspace-excluded)
        run: cargo fmt --manifest-path mur-agent-gui/src-tauri/Cargo.toml -- --check
      - name: fmt mur-hub-gui (workspace-excluded)
        run: cargo fmt --manifest-path mur-hub-gui/src-tauri/Cargo.toml -- --check

  gui:
    name: GUI crate (mur-agent-gui)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.gui == 'true'
    runs-on: ubuntu-22.04   # widest glibc compat for AppImage downstream
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mur-agent-gui/src-tauri
          key: ${{ env.ImageOS }}-${{ env.ImageVersion }}
          # Restore-only (see CACHE BUDGET above): cold, this job still ends
          # well inside the Windows test job's wall time.
          save-if: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: 'mur-agent-gui/ui/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'mur-agent-gui/ui/package-lock.json'
      - name: Refresh apt lists (avoid stale-index 404 on transitive deps)
        # The runner image ships a snapshot apt index; when Ubuntu security-
        # updates a transitive dep (e.g. libnghttp2-dev) the old version's .deb
        # is pulled from the mirror and the pinned index 404s. cache-apt-pkgs
        # does not `apt-get update` first, so refresh the index here.
        run: sudo apt-get update
      - name: Install Linux system libraries (Tauri 2 + voice + OCR)
        # cache-apt-pkgs-action caches the apt download tarball at
        # ~/.apt-cache and replays installs from there on subsequent runs.
        # Saves ~75-85s per run on a job whose apt-install step was 91s.
        # `version: 1.0` is the cache key — bump it when adding/removing
        # packages so the cache invalidates.
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          version: "1.1"
          packages: >-
            libwebkit2gtk-4.1-dev
            libsoup-3.0-dev
            libayatana-appindicator3-dev
            librsvg2-dev
            libasound2-dev
            libdbus-1-dev
            pkg-config
            protobuf-compiler
            libprotobuf-dev
            tesseract-ocr
            tesseract-ocr-eng
      - name: Install npm deps
        run: cd mur-agent-gui/ui && npm ci
      - name: Frontend build (populates dist/ for cargo check)
        run: cd mur-agent-gui/ui && npm run build
      - name: Build sidecar (needed for tauri.conf.json bundle.externalBin)
        run: |
          cargo build -p mur-agent-runtime --release --target x86_64-unknown-linux-gnu
          mkdir -p mur-agent-gui/src-tauri/binaries
          cp target/x86_64-unknown-linux-gnu/release/mur-agent-runtime \
             mur-agent-gui/src-tauri/binaries/mur-agent-runtime-x86_64-unknown-linux-gnu
      - name: cargo check
        run: cargo check --manifest-path mur-agent-gui/src-tauri/Cargo.toml
      - name: cargo test --lib
        run: cargo test --manifest-path mur-agent-gui/src-tauri/Cargo.toml --lib
      - name: cargo clippy
        run: cargo clippy --manifest-path mur-agent-gui/src-tauri/Cargo.toml --lib -- -D warnings

  hub_gui:
    name: Hub GUI crate (mur-hub-gui) — ${{ matrix.os }}
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.hub_gui == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # macOS pinned to 14 (Apple Silicon): the macos-latest → macOS-26 image
        # migration breaks the system-configuration-sys / lance build scripts
        # ("cannot execute binary file", exit 126). The Test job pins macos-14
        # for stability for the same reason.
        os: [ubuntu-22.04, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mur-hub-gui/src-tauri
          key: ${{ env.ImageOS }}-${{ env.ImageVersion }}
          # Restore-only on every OS (see CACHE BUDGET above): cold, even the
          # Windows leg (16-26m) ends inside the Windows test job's wall time.
          save-if: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: 'mur-hub-gui/ui/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'mur-hub-gui/ui/package-lock.json'
      - name: Refresh apt lists (avoid stale-index 404 on transitive deps)
        if: runner.os == 'Linux'
        run: sudo apt-get update
      - name: Install Linux system libraries (Tauri 2)
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          version: "1.1"
          packages: >-
            libwebkit2gtk-4.1-dev
            libsoup-3.0-dev
            libayatana-appindicator3-dev
            librsvg2-dev
            pkg-config
            protobuf-compiler
            libprotobuf-dev
            libasound2-dev
            libdbus-1-dev
      - name: Install protobuf (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install protobuf (Windows)
        if: runner.os == 'Windows'
        # choco's community feed intermittently serves invalid XML, which makes
        # `choco install protoc` silently install 0 packages and then break the
        # lance-encoding build ("Could not find protoc"). Pull protoc straight
        # from GitHub releases instead — no community-feed dependency.
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install npm deps
        run: cd mur-hub-gui/ui && npm ci
      - name: Frontend build
        run: cd mur-hub-gui/ui && npm run build
      - name: cargo check
        run: cargo check --manifest-path mur-hub-gui/src-tauri/Cargo.toml
      # Not --lib: the integration test in tests/ went unnoticed for months
      # after a signature change stopped it compiling, because nothing built
      # that target.
      - name: cargo test
        run: cargo test --manifest-path mur-hub-gui/src-tauri/Cargo.toml
      - name: cargo clippy
        run: cargo clippy --manifest-path mur-hub-gui/src-tauri/Cargo.toml --all-targets -- -D warnings

  e2e_quick:
    name: E2E orchestration smoke (quick mode)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.e2e == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.ImageOS }}-${{ env.ImageVersion }}
          # Restore-only (see CACHE BUDGET above): peaks at 23m cold.
          save-if: false
      - name: Install protobuf
        run: brew install protobuf
      - name: Run quick e2e smoke
        run: bash scripts/e2e/p1-export-gui.sh

  # Old and new rust-cache keys sit side by side after a Cargo.lock, rustc,
  # or runner-image change (the key embeds all three). When all three test
  # OSes roll over together, main's Rust caches grow by ~4.35 GB, the repo
  # passes 10 GB, and GitHub evicts the least-recently-read entry, which is
  # the Hub sccache that release-cache-warm.yml keeps for release tags.
  # rust-cache saves in its post step, so a job cannot prune its own
  # predecessor. This job runs after test and clippy finish and keeps only
  # the newest entry per job+OS. It is not in ci-pass: a failed prune must
  # not fail main.
  prune-rust-cache:
    name: Prune superseded Rust caches
    needs: [test, clippy]
    if: always() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CACHE_PREFIX: v0-rust-
    steps:
      - name: Delete all but the newest entry per job and OS
        run: |
          set -euo pipefail
          # Key shape: v0-rust-<prefix>-<job>-<OS>-<arch>-<envhash>-<lockhash>.
          # Group on everything before the two trailing hashes.
          gh api --paginate \
            "repos/${GH_REPO}/actions/caches?per_page=100&ref=${GITHUB_REF}&key=${CACHE_PREFIX}" \
            --jq '.actions_caches[] | [.id, .key, .created_at] | @tsv' \
          | sort -t$'\t' -k3,3r \
          | awk -F'\t' '{ g = $2; sub(/-[^-]+-[^-]+$/, "", g); if (seen[g]++) print $1 "\t" $2 }' \
          | while IFS=$'\t' read -r id key; do
              echo "delete ${id} ${key}"
              gh api -X DELETE "repos/${GH_REPO}/actions/caches/${id}"
            done

  freebsd-platform-audit:
    name: FreeBSD platform audit
    if: ${{ !(github.event.action == 'edited' && !github.event.changes.base) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify every platform-specific Rust line is classified
        run: python3 scripts/check-freebsd-audit.py

  required-reason-apis:
    name: Required Reason API gate
    # Always run — 5s, runs against any source change so safe to keep.
    if: ${{ !(github.event.action == 'edited' && !github.event.changes.base) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run gate
        run: scripts/check-required-reason-apis.sh

  # Aggregator job — single required check for branch protection.
  # Resolves the GitHub Actions oddity where job-level `if:` skips show as
  # "skipped" instead of "passed", which can break required-status-check
  # rules. Configure branch protection to require ONLY this `ci-pass` check;
  # the underlying jobs become advisory.
  ci-pass:
    name: CI pass
    if: ${{ always() }}
    # An edit run waits for the real run, which is bounded by its slowest job
    # (clippy: 90 min).
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    needs: [changes, test, clippy, fmt, gui, hub_gui, e2e_quick, freebsd-platform-audit, required-reason-apis]
    runs-on: ubuntu-latest
    steps:
      # `skipped` is fine (paths-filter excluded the job); failure/cancelled
      # anywhere fails the gate. `needs.*` includes `changes` itself, which
      # the old per-job version never checked — a failed `changes` used to
      # skip every downstream job and pass this gate green.
      - name: Fail on any failed or cancelled upstream job
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo '${{ toJson(needs) }}'
          exit 1

      # A title/body edit skips every job above, and a skipped `CI pass` counts
      # as satisfied: the PR would show CLEAN while the real run is still
      # queued or even failing. So an edit run reports the real run's result
      # instead — pending while it runs, red if it fails.
      - name: Mirror the PR's real CI run
        if: ${{ github.event.action == 'edited' && !github.event.changes.base }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          EDIT_RUN_NAME: 'CI (title/body edit)'
          # The real run may not exist yet when an edit lands right after a push.
          FIND_TIMEOUT_SECS: '180'
          POLL_SECS: '30'
        run: |
          set -euo pipefail
          query='[.workflow_runs[]
                  | select(.id != ($cur|tonumber) and .display_title != $name)]
                 | sort_by(.created_at) | last // empty
                 | "\(.id) \(.status) \(.conclusion // "none")"'
          start=$SECONDS
          while true; do
            line=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100" \
              | jq -r --arg cur "$CURRENT_RUN_ID" --arg name "$EDIT_RUN_NAME" "$query")
            if [ -z "$line" ]; then
              if [ $((SECONDS - start)) -ge "$FIND_TIMEOUT_SECS" ]; then
                echo "No pull_request CI run found for $HEAD_SHA; failing closed."
                exit 1
              fi
            else
              read -r id status conclusion <<<"$line"
              echo "real run $id: $status $conclusion"
              if [ "$status" = completed ]; then
                [ "$conclusion" = success ] && exit 0
                echo "Real CI run $id finished as '$conclusion'."
                exit 1
              fi
            fi
            sleep "$POLL_SECS"
          done

