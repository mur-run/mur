name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux + macOS — single-shard nextest. These OSes are already fast
  # (~10 min on ubuntu, ~16 min on macos) so sharding overhead doesn't pay
  # off; a single-shard run wins on simplicity.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler \
            libprotobuf-dev \
            libdbus-1-dev \
            pkg-config
      - name: Install protobuf (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo check --all
      - run: cargo nextest run --workspace --profile ci

  # Windows — build the test archive once, then run it in 4 parallel shards.
  # Pattern: https://github.com/nextest-rs/reuse-build-partition-example
  # Used by tokio, clap, sqlx for the same reason we need it: Windows MSVC
  # `cargo test --all` was ~45 min for mur even after PR-B's nextest swap
  # (estimated ~25-28 min). Sharding 4-way targets ~10-13 min.
  #
  # The archive contains compiled test binaries + their cargo metadata. Each
  # shard downloads the archive, picks its partition via stable hash
  # (deterministic across re-runs and across new test additions), and runs
  # only that subset.
  test-windows-build:
    name: Test (windows-latest, build archive)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protobuf (Windows)
        run: choco install protoc -y
      - name: Defender exclusions
        # Cuts ~5-15% when Defender real-time scan is active. Harmless
        # no-op otherwise. continue-on-error so a Defender API change
        # won't break CI.
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}\target"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionProcess "rustc.exe"
          Add-MpPreference -ExclusionProcess "cargo.exe"
          Add-MpPreference -ExclusionProcess "link.exe"
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo check --all
      - name: Build test archive
        run: cargo nextest archive --workspace --archive-file nextest.tar.zst
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: nextest-archive-windows
          path: nextest.tar.zst
          retention-days: 1

  test-windows-shard:
    name: Test (windows-latest, shard ${{ matrix.partition }}/4)
    needs: test-windows-build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    steps:
      # The archive contains compiled binaries, but some integration tests
      # in this repo read source-tree relative paths at runtime (e.g.
      # `tests/data/...`); checkout is needed for those. Cost is ~10s per
      # shard, well-amortized.
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protobuf (Windows)
        run: choco install protoc -y
      - name: Defender exclusions
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}\target"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Download archive
        uses: actions/download-artifact@v4
        with:
          name: nextest-archive-windows
      - name: Run shard ${{ matrix.partition }}/4
        # `hash:m/n` is deterministic — the same test always lands on the
        # same shard regardless of new tests being added. This makes
        # shard-failure reproductions reliable on re-run.
        run: cargo nextest run --archive-file nextest.tar.zst --partition hash:${{ matrix.partition }}/4 --profile ci

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler \
            libprotobuf-dev \
            libdbus-1-dev \
            pkg-config
      - run: cargo clippy --all -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: fmt mur-agent-gui (workspace-excluded)
        run: cargo fmt --manifest-path mur-agent-gui/src-tauri/Cargo.toml -- --check

  gui:
    name: GUI crate (mur-agent-gui)
    runs-on: ubuntu-22.04   # widest glibc compat for AppImage downstream
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mur-agent-gui/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version-file: 'mur-agent-gui/ui/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'mur-agent-gui/ui/package-lock.json'
      - name: Install Linux system libraries (Tauri 2 + voice + OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            pkg-config \
            protobuf-compiler \
            libprotobuf-dev \
            tesseract-ocr \
            tesseract-ocr-eng
      - name: Install npm deps
        run: cd mur-agent-gui/ui && npm ci
      - name: Frontend build (populates dist/ for cargo check)
        run: cd mur-agent-gui/ui && npm run build
      - name: Build sidecar (needed for tauri.conf.json bundle.externalBin)
        run: |
          cargo build -p mur-agent-runtime --release --target x86_64-unknown-linux-gnu
          mkdir -p mur-agent-gui/src-tauri/binaries
          cp target/x86_64-unknown-linux-gnu/release/mur-agent-runtime \
             mur-agent-gui/src-tauri/binaries/mur-agent-runtime-x86_64-unknown-linux-gnu
      - name: cargo check
        run: cargo check --manifest-path mur-agent-gui/src-tauri/Cargo.toml
      - name: cargo test --lib
        run: cargo test --manifest-path mur-agent-gui/src-tauri/Cargo.toml --lib
      - name: cargo clippy
        run: cargo clippy --manifest-path mur-agent-gui/src-tauri/Cargo.toml --lib -- -D warnings

  e2e_quick:
    name: E2E orchestration smoke (quick mode)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protobuf
        run: brew install protobuf
      - name: Run quick e2e smoke
        run: bash scripts/e2e/p1-export-gui.sh

  required-reason-apis:
    name: Required Reason API gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run gate
        run: scripts/check-required-reason-apis.sh

