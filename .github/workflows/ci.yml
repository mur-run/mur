name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new commit on a PR obsoletes the in-flight run for the old commit —
# cancel it instead of finishing a 3-OS matrix nobody will read. push:main
# runs never cancel (post-merge validation must complete).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Disable incremental compilation across all CI jobs. Incremental adds a
  # dependency-graph metadata layer that defeats Swatinem/rust-cache and
  # bloats the cache key. From-scratch builds (which CI always is) are
  # ~15-20% faster without it.
  CARGO_INCREMENTAL: 0
  # Belt-and-suspenders for the test profile: even if a downstream PR
  # adds a [profile.test] override that re-enables debug, this env wins.
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # Decide what changed; downstream jobs gate on these outputs to skip
  # irrelevant work on docs-only / GUI-only / etc PRs. `push:main` always
  # runs everything (set 'true' below) so post-merge runs catch any
  # cross-cutting break.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      gui:  ${{ steps.filter.outputs.gui }}
      hub_gui: ${{ steps.filter.outputs.hub_gui }}
      e2e:  ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          # Use the default `some` quantifier — at least ONE changed file
          # matching a filter's patterns is enough to trigger that filter.
          # The previous `predicate-quantifier: every` was a misreading of
          # the docs and required ALL changed files to match, so any
          # multi-file PR that touched even one file outside a filter's
          # patterns came back false → all jobs skipped → tests bypassed.
          #
          # For push:main events, paths-filter falls back to "match all
          # filters as true" automatically when there's no diff context,
          # so the post-merge safety net is preserved without `every`.
          filters: |
            code:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - '.config/**'
              - '.github/workflows/ci.yml'
              - 'scripts/**'
              - 'rust-toolchain.toml'
            gui:
              - 'mur-agent-gui/**'
              - 'mur-agent-runtime/**'
              - 'mur-core/**'
              - 'mur-common/**'
              - '.github/workflows/ci.yml'
            hub_gui:
              - 'mur-hub-gui/**'
              - 'mur-gui-core/**'
              - 'mur-core/**'
              - 'mur-common/**'
              - '.github/workflows/ci.yml'
            e2e:
              - 'mur-agent-gui/**'
              - 'mur-agent-runtime/**'
              - 'scripts/e2e/**'
              - '.github/workflows/ci.yml'

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60 # hung build ≠ 6h default; normal runs are well under
    strategy:
      fail-fast: false
      matrix:
        # macos-14: its image bundles Xcode 15.4, which we select below. The
        # default Xcode 16.4 (now on both macos-14 and macos-latest) breaks the
        # old vendored whisper.cpp build two ways — clang treats it as pre-C++11
        # ("no template 'function' in namespace std", ">>" errors) and the link
        # can't find clang_rt.osx (clang/17/lib/darwin missing). 15.4 builds it.
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Scope the cache to the runner image. GitHub image upgrades can
          # change the bundled MSVC/CMake generator (e.g. VS 17 2022 ->
          # VS 18 2026); without this, a restored target/ carries a stale
          # whisper-rs-sys CMakeCache.txt and CMake aborts on generator
          # mismatch. Keying on ImageVersion forces a fresh build on bump.
          key: ${{ env.ImageOS }}-${{ env.ImageVersion }}
      - name: Select Xcode 15.4 (macOS)
        if: runner.os == 'macOS'
        # The runner's default Xcode 16.4 breaks the old vendored whisper.cpp
        # build (pre-C++11 clang errors) and the clang_rt.osx link. Xcode 15.4
        # (bundled on macos-14) builds + links it cleanly. Set before any cargo
        # build so build scripts (cc/cmake) use the right toolchain.
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler \
            libprotobuf-dev \
            libdbus-1-dev \
            libasound2-dev \
            libespeak-ng-dev \
            pkg-config
      - name: Install protobuf (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install protobuf (Windows)
        if: runner.os == 'Windows'
        # choco's community feed intermittently serves invalid XML, which makes
        # `choco install protoc` silently install 0 packages and then break the
        # lance-encoding build ("Could not find protoc"). Pull protoc straight
        # from GitHub releases instead — no community-feed dependency.
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Defender exclusions (Windows)
        # Cuts ~5-15% off Windows wall-clock when Defender real-time scan
        # is active on the runner. Harmless no-op if the runner image already
        # disabled it. continue-on-error so a Defender API change won't
        # break CI.
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}\target"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          Add-MpPreference -ExclusionProcess "rustc.exe"
          Add-MpPreference -ExclusionProcess "cargo.exe"
          Add-MpPreference -ExclusionProcess "link.exe"
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Create test signing identity (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/test-signing-identity.sh
      # `cargo nextest run` builds + runs in one cargo invocation; `cargo
      # check --all` was a redundant pre-check whose .rmeta artifacts don't
      # help nextest's downstream test-binary build (different codegen
      # path). Dropping it saves ~66s on ubuntu, ~50s on macOS, ~200s on
      # Windows. `--profile ci` (in .config/nextest.toml) sets timeouts +
      # caps heavy-test (lance/qdrant/tantivy) concurrency to avoid OOM on
      # 16 GB Windows runners.
      - run: cargo nextest run --workspace --locked --profile ci
        env:
          # The large `mur` clap CLI needs a deeper per-thread stack to parse on
          # Windows, whose 1 MB default thread stack overflows during clap's
          # derive parsing (each test runs on its own thread). 16 MB is safe on
          # every OS; Linux/macOS already default higher.
          RUST_MIN_STACK: "16777216"

  clippy:
    name: Clippy
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Headroom, because 45 proved too tight to recover from — NOT because a
    # cold build costs 45 minutes (measured: a cold run takes ~11 min).
    # Three runs in a row were killed at the 45m mark with "No cache found"
    # (main @962ac841 and two on #968) while a fourth cold run of the SAME
    # Rust code finished in 10m41s. Whatever slows a run down that far is
    # unexplained — runner contention is the suspicion, not a finding. What
    # made it stick was the feedback loop: a killed job never runs
    # rust-cache's save step, so every retry starts cold too, and re-running
    # can't clear it. The extra budget buys a bad run the chance to finish
    # and leave a cache behind. Still far below the 6h default, so a
    # genuinely hung build is still caught.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.ImageOS }}-${{ env.ImageVersion }}
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler \
            libprotobuf-dev \
            libdbus-1-dev \
            libasound2-dev \
            libespeak-ng-dev \
            pkg-config
      # `--no-deps` skips clippy on the ~800 dependency crates (linting them
      # serves no purpose since we can't fix them upstream from here). Saves
      # ~50-70s on a 125s job. Real lint coverage on our own code is unchanged.
      #
      # `--all-targets` includes tests, benches and examples. Without it, test
      # code is never linted and rots: the sweep that first added this flag had
      # ~40 accumulated violations to clear, two of which were real defects
      # (an error-loop `flatten()` and an undefined-truncate file open).
      - run: cargo clippy --all --all-targets --no-deps --locked -- -D warnings

  fmt:
    name: Format
    # Always run — fmt is 17s and catches commit-hook bypasses.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: fmt mur-agent-gui (workspace-excluded)
        run: cargo fmt --manifest-path mur-agent-gui/src-tauri/Cargo.toml -- --check
      - name: fmt mur-hub-gui (workspace-excluded)
        run: cargo fmt --manifest-path mur-hub-gui/src-tauri/Cargo.toml -- --check

  gui:
    name: GUI crate (mur-agent-gui)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.gui == 'true'
    runs-on: ubuntu-22.04   # widest glibc compat for AppImage downstream
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mur-agent-gui/src-tauri
          key: ${{ env.ImageOS }}-${{ env.ImageVersion }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: 'mur-agent-gui/ui/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'mur-agent-gui/ui/package-lock.json'
      - name: Refresh apt lists (avoid stale-index 404 on transitive deps)
        # The runner image ships a snapshot apt index; when Ubuntu security-
        # updates a transitive dep (e.g. libnghttp2-dev) the old version's .deb
        # is pulled from the mirror and the pinned index 404s. cache-apt-pkgs
        # does not `apt-get update` first, so refresh the index here.
        run: sudo apt-get update
      - name: Install Linux system libraries (Tauri 2 + voice + OCR)
        # cache-apt-pkgs-action caches the apt download tarball at
        # ~/.apt-cache and replays installs from there on subsequent runs.
        # Saves ~75-85s per run on a job whose apt-install step was 91s.
        # `version: 1.0` is the cache key — bump it when adding/removing
        # packages so the cache invalidates.
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          version: "1.1"
          packages: >-
            libwebkit2gtk-4.1-dev
            libsoup-3.0-dev
            libayatana-appindicator3-dev
            librsvg2-dev
            libasound2-dev
            libdbus-1-dev
            pkg-config
            protobuf-compiler
            libprotobuf-dev
            tesseract-ocr
            tesseract-ocr-eng
      - name: Install npm deps
        run: cd mur-agent-gui/ui && npm ci
      - name: Frontend build (populates dist/ for cargo check)
        run: cd mur-agent-gui/ui && npm run build
      - name: Build sidecar (needed for tauri.conf.json bundle.externalBin)
        run: |
          cargo build -p mur-agent-runtime --release --target x86_64-unknown-linux-gnu
          mkdir -p mur-agent-gui/src-tauri/binaries
          cp target/x86_64-unknown-linux-gnu/release/mur-agent-runtime \
             mur-agent-gui/src-tauri/binaries/mur-agent-runtime-x86_64-unknown-linux-gnu
      - name: cargo check
        run: cargo check --manifest-path mur-agent-gui/src-tauri/Cargo.toml
      - name: cargo test --lib
        run: cargo test --manifest-path mur-agent-gui/src-tauri/Cargo.toml --lib
      - name: cargo clippy
        run: cargo clippy --manifest-path mur-agent-gui/src-tauri/Cargo.toml --lib -- -D warnings

  hub_gui:
    name: Hub GUI crate (mur-hub-gui) — ${{ matrix.os }}
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.hub_gui == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # macOS pinned to 14 (Apple Silicon): the macos-latest → macOS-26 image
        # migration breaks the system-configuration-sys / lance build scripts
        # ("cannot execute binary file", exit 126). The Test job pins macos-14
        # for stability for the same reason.
        os: [ubuntu-22.04, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mur-hub-gui/src-tauri
          key: ${{ env.ImageOS }}-${{ env.ImageVersion }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: 'mur-hub-gui/ui/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'mur-hub-gui/ui/package-lock.json'
      - name: Refresh apt lists (avoid stale-index 404 on transitive deps)
        if: runner.os == 'Linux'
        run: sudo apt-get update
      - name: Install Linux system libraries (Tauri 2)
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          version: "1.1"
          packages: >-
            libwebkit2gtk-4.1-dev
            libsoup-3.0-dev
            libayatana-appindicator3-dev
            librsvg2-dev
            pkg-config
            protobuf-compiler
            libprotobuf-dev
            libasound2-dev
            libdbus-1-dev
      - name: Install protobuf (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install protobuf (Windows)
        if: runner.os == 'Windows'
        # choco's community feed intermittently serves invalid XML, which makes
        # `choco install protoc` silently install 0 packages and then break the
        # lance-encoding build ("Could not find protoc"). Pull protoc straight
        # from GitHub releases instead — no community-feed dependency.
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install npm deps
        run: cd mur-hub-gui/ui && npm ci
      - name: Frontend build
        run: cd mur-hub-gui/ui && npm run build
      - name: cargo check
        run: cargo check --manifest-path mur-hub-gui/src-tauri/Cargo.toml
      # Not --lib: the integration test in tests/ went unnoticed for months
      # after a signature change stopped it compiling, because nothing built
      # that target.
      - name: cargo test
        run: cargo test --manifest-path mur-hub-gui/src-tauri/Cargo.toml
      - name: cargo clippy
        run: cargo clippy --manifest-path mur-hub-gui/src-tauri/Cargo.toml --all-targets -- -D warnings

  e2e_quick:
    name: E2E orchestration smoke (quick mode)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.e2e == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.ImageOS }}-${{ env.ImageVersion }}
      - name: Install protobuf
        run: brew install protobuf
      - name: Run quick e2e smoke
        run: bash scripts/e2e/p1-export-gui.sh

  required-reason-apis:
    name: Required Reason API gate
    # Always run — 5s, runs against any source change so safe to keep.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run gate
        run: scripts/check-required-reason-apis.sh

  # Aggregator job — single required check for branch protection.
  # Resolves the GitHub Actions oddity where job-level `if:` skips show as
  # "skipped" instead of "passed", which can break required-status-check
  # rules. Configure branch protection to require ONLY this `ci-pass` check;
  # the underlying jobs become advisory.
  ci-pass:
    name: CI pass
    if: always()
    needs: [changes, test, clippy, fmt, gui, hub_gui, e2e_quick, required-reason-apis]
    runs-on: ubuntu-latest
    steps:
      # `skipped` is fine (paths-filter excluded the job); failure/cancelled
      # anywhere fails the gate. `needs.*` includes `changes` itself, which
      # the old per-job version never checked — a failed `changes` used to
      # skip every downstream job and pass this gate green.
      - name: Fail on any failed or cancelled upstream job
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo '${{ toJson(needs) }}'
          exit 1
